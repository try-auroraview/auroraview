[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "auroraview-offscreen"
version = "0.1.0.dev0"
description = "Optional process-isolated AuroraView frame and input transport"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/try-auroraview/auroraview"

[tool.hatch.build.targets.wheel]
packages = ["python/auroraview_offscreen"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
