name: PR Checks

# This workflow runs comprehensive checks on PRs to ensure quality before merging.
# Optimized with path-based filtering to run only necessary checks based on changed files.
#
# Package Isolation Strategy (2025-12):
# - Each package (Rust crates, SDK, MCP, Gallery, Docs) has its own CI workflow
# - PR checks call these workflows based on detected changes
# - Only affected packages are built and tested
# - Dependency chains are respected (e.g., core changes trigger CLI tests)
#
# Artifact Reuse Strategy:
# - sdk-build: Builds SDK once, artifacts reused by gallery-e2e and gallery-pack
# - cli-build: Builds CLI once, artifacts reused by gallery-pack
# - pre-build: Builds wheels once, artifacts reused by python-tests, wheel-build, qt-tests, gallery-pack
# - This eliminates duplicate builds and significantly reduces CI time
#
# Path Filter Categories:
# - rust-*: Fine-grained Rust crate changes (signals, core, pack, cli, etc.)
# - python: Python source code changes -> triggers Python tests
# - sdk: TypeScript SDK changes -> triggers SDK builds
# - gallery: Gallery app changes -> triggers Gallery tests
# - docs: Documentation changes -> triggers docs build only
# - ci: CI configuration changes -> triggers all checks
# - tests: Test file changes -> triggers relevant tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: '600'
  CARGO_NET_RETRY: '10'
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # =============================================================================
  # Path Detection - Determines which jobs to run based on changed files
  # =============================================================================
  path-filter:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # High-level category flags
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      sdk: ${{ steps.filter.outputs.sdk }}
      gallery: ${{ steps.filter.outputs.gallery }}
      docs: ${{ steps.filter.outputs.docs }}
      ci: ${{ steps.filter.outputs.ci }}
      tests: ${{ steps.filter.outputs.tests }}
      # Fine-grained Rust crate flags
      rust-signals: ${{ steps.filter.outputs.rust-signals }}
      rust-protect: ${{ steps.filter.outputs.rust-protect }}
      rust-plugin-core: ${{ steps.filter.outputs.rust-plugin-core }}
      rust-plugin-fs: ${{ steps.filter.outputs.rust-plugin-fs }}
      rust-extensions: ${{ steps.filter.outputs.rust-extensions }}
      rust-plugins: ${{ steps.filter.outputs.rust-plugins }}
      rust-core: ${{ steps.filter.outputs.rust-core }}
      rust-pack: ${{ steps.filter.outputs.rust-pack }}
      rust-cli: ${{ steps.filter.outputs.rust-cli }}
      rust-root: ${{ steps.filter.outputs.rust-root }}
      # Composite flags for convenience
      needs_wheel: ${{ steps.composite.outputs.needs_wheel }}
      needs_rust_checks: ${{ steps.composite.outputs.needs_rust_checks }}
      needs_python_tests: ${{ steps.composite.outputs.needs_python_tests }}
      needs_sdk_build: ${{ steps.composite.outputs.needs_sdk_build }}
      needs_gallery_tests: ${{ steps.composite.outputs.needs_gallery_tests }}
      needs_docs_build: ${{ steps.composite.outputs.needs_docs_build }}
      # Rust crate dependency flags (includes transitive deps)
      needs_rust_core: ${{ steps.rust-deps.outputs.needs_core }}
      needs_rust_cli: ${{ steps.rust-deps.outputs.needs_cli }}
      needs_rust_pack: ${{ steps.rust-deps.outputs.needs_pack }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'benches/**'
              - 'tests/rust/**'
            rust-signals:
              - 'crates/auroraview-signals/**'
            rust-protect:
              - 'crates/auroraview-protect/**'
            rust-plugin-core:
              - 'crates/auroraview-plugins/core/**'
            rust-plugin-fs:
              - 'crates/auroraview-plugins/fs/**'
            rust-extensions:
              - 'crates/auroraview-extensions/**'
            rust-plugins:
              - 'crates/auroraview-plugins/Cargo.toml'
              - 'crates/auroraview-plugins/src/**'
            rust-core:
              - 'crates/auroraview-core/**'
            rust-pack:
              - 'crates/auroraview-pack/**'
            rust-cli:
              - 'crates/auroraview-cli/**'
            rust-root:
              - 'src/**'
              - 'Cargo.toml'
            python:
              - 'python/**'
              - 'pyproject.toml'
              - 'tests/python/**'
              - 'noxfile.py'
            sdk:
              - 'packages/auroraview-sdk/**'
            gallery:
              - 'gallery/**'
            docs:
              - 'docs/**'
              - '*.md'
              - 'website/**'
            ci:
              - '.github/**'
              - 'justfile'
              - 'scripts/audit_unsafe.py'
              - 'scripts/unsafe_allowlist.txt'
              - '.pre-commit-config.yaml'
              - '.codecov.yml'
            tests:
              - 'tests/**'
              - 'benches/**'

      - name: Compute Rust dependency chain
        id: rust-deps
        run: |
          # Direct changes
          signals="${{ steps.filter.outputs.rust-signals }}"
          protect="${{ steps.filter.outputs.rust-protect }}"
          plugin_core="${{ steps.filter.outputs.rust-plugin-core }}"
          plugin_fs="${{ steps.filter.outputs.rust-plugin-fs }}"
          extensions="${{ steps.filter.outputs.rust-extensions }}"
          plugins="${{ steps.filter.outputs.rust-plugins }}"
          core="${{ steps.filter.outputs.rust-core }}"
          pack="${{ steps.filter.outputs.rust-pack }}"
          cli="${{ steps.filter.outputs.rust-cli }}"
          root="${{ steps.filter.outputs.rust-root }}"
          ci="${{ steps.filter.outputs.ci }}"

          # Compute transitive dependencies
          # auroraview-plugins: depends on plugin-core, plugin-fs, extensions
          if [[ "$plugins" == "true" || "$plugin_core" == "true" || "$plugin_fs" == "true" || "$extensions" == "true" ]]; then
            needs_plugins="true"
          else
            needs_plugins="false"
          fi

          # auroraview-core: depends on signals, plugins
          if [[ "$core" == "true" || "$signals" == "true" || "$needs_plugins" == "true" || "$ci" == "true" ]]; then
            needs_core="true"
          else
            needs_core="false"
          fi

          # auroraview-pack: depends on protect (optional)
          if [[ "$pack" == "true" || "$protect" == "true" || "$ci" == "true" ]]; then
            needs_pack="true"
          else
            needs_pack="false"
          fi

          # auroraview-cli: depends on core, pack
          if [[ "$cli" == "true" || "$needs_core" == "true" || "$needs_pack" == "true" || "$ci" == "true" ]]; then
            needs_cli="true"
          else
            needs_cli="false"
          fi

          echo "needs_core=$needs_core" >> $GITHUB_OUTPUT
          echo "needs_pack=$needs_pack" >> $GITHUB_OUTPUT
          echo "needs_cli=$needs_cli" >> $GITHUB_OUTPUT

      - name: Compute composite flags
        id: composite
        run: |
          rust="${{ steps.filter.outputs.rust }}"
          python="${{ steps.filter.outputs.python }}"
          sdk="${{ steps.filter.outputs.sdk }}"
          gallery="${{ steps.filter.outputs.gallery }}"
          docs="${{ steps.filter.outputs.docs }}"
          ci="${{ steps.filter.outputs.ci }}"

          # needs_wheel: when Rust, Python, or SDK changes (need to rebuild wheel)
          if [[ "$rust" == "true" || "$python" == "true" || "$sdk" == "true" || "$ci" == "true" ]]; then
            echo "needs_wheel=true" >> $GITHUB_OUTPUT
          else
            echo "needs_wheel=false" >> $GITHUB_OUTPUT
          fi

          # needs_rust_checks: when Rust code changes
          if [[ "$rust" == "true" || "$ci" == "true" ]]; then
            echo "needs_rust_checks=true" >> $GITHUB_OUTPUT
          else
            echo "needs_rust_checks=false" >> $GITHUB_OUTPUT
          fi

          # needs_python_tests: when Python or Rust changes (Rust changes may affect Python bindings)
          if [[ "$python" == "true" || "$rust" == "true" || "$ci" == "true" ]]; then
            echo "needs_python_tests=true" >> $GITHUB_OUTPUT
          else
            echo "needs_python_tests=false" >> $GITHUB_OUTPUT
          fi

          # needs_sdk_build: when SDK changes
          if [[ "$sdk" == "true" || "$ci" == "true" ]]; then
            echo "needs_sdk_build=true" >> $GITHUB_OUTPUT
          else
            echo "needs_sdk_build=false" >> $GITHUB_OUTPUT
          fi

          # needs_gallery_tests: when Gallery or SDK changes (Gallery depends on SDK)
          if [[ "$gallery" == "true" || "$sdk" == "true" || "$ci" == "true" ]]; then
            echo "needs_gallery_tests=true" >> $GITHUB_OUTPUT
          else
            echo "needs_gallery_tests=false" >> $GITHUB_OUTPUT
          fi

          # needs_docs_build: when docs change
          if [[ "$docs" == "true" || "$ci" == "true" ]]; then
            echo "needs_docs_build=true" >> $GITHUB_OUTPUT
          else
            echo "needs_docs_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Summary of detected changes
        run: |
          echo "## 🔍 Detected Changes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### High-Level Categories" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Changed | Will Run |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust | ${{ steps.filter.outputs.rust }} | Rust checks, CLI build |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ steps.filter.outputs.python }} | Python tests |" >> $GITHUB_STEP_SUMMARY
          echo "| SDK | ${{ steps.filter.outputs.sdk }} | SDK build |" >> $GITHUB_STEP_SUMMARY
          echo "| Gallery | ${{ steps.filter.outputs.gallery }} | Gallery E2E |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs | ${{ steps.filter.outputs.docs }} | Docs build |" >> $GITHUB_STEP_SUMMARY
          echo "| CI | ${{ steps.filter.outputs.ci }} | All checks |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rust Crate Changes" >> $GITHUB_STEP_SUMMARY
          echo "| Crate | Direct Change | Will Test |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| aurora-signals | ${{ steps.filter.outputs.rust-signals }} | ${{ steps.filter.outputs.rust-signals }} |" >> $GITHUB_STEP_SUMMARY
          echo "| aurora-protect | ${{ steps.filter.outputs.rust-protect }} | ${{ steps.filter.outputs.rust-protect }} |" >> $GITHUB_STEP_SUMMARY
          echo "| auroraview-core | ${{ steps.filter.outputs.rust-core }} | ${{ steps.rust-deps.outputs.needs_core }} |" >> $GITHUB_STEP_SUMMARY
          echo "| auroraview-pack | ${{ steps.filter.outputs.rust-pack }} | ${{ steps.rust-deps.outputs.needs_pack }} |" >> $GITHUB_STEP_SUMMARY
          echo "| auroraview-cli | ${{ steps.filter.outputs.rust-cli }} | ${{ steps.rust-deps.outputs.needs_cli }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Composite Flags" >> $GITHUB_STEP_SUMMARY
          echo "- needs_wheel: ${{ steps.composite.outputs.needs_wheel }}" >> $GITHUB_STEP_SUMMARY
          echo "- needs_rust_checks: ${{ steps.composite.outputs.needs_rust_checks }}" >> $GITHUB_STEP_SUMMARY
          echo "- needs_python_tests: ${{ steps.composite.outputs.needs_python_tests }}" >> $GITHUB_STEP_SUMMARY
          echo "- needs_sdk_build: ${{ steps.composite.outputs.needs_sdk_build }}" >> $GITHUB_STEP_SUMMARY
          echo "- needs_gallery_tests: ${{ steps.composite.outputs.needs_gallery_tests }}" >> $GITHUB_STEP_SUMMARY
          echo "- needs_docs_build: ${{ steps.composite.outputs.needs_docs_build }}" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Commit Lint - Validate commit messages follow Conventional Commits
  # =============================================================================
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup vx
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'bun'
          cache: 'false'

      - name: Lint commits
        run: |
          vx bun install --no-save @commitlint/cli @commitlint/config-conventional
          vx bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # =============================================================================
  # Quick Checks - Always run for code quality (fast, < 5 min)
  # =============================================================================
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [path-filter]
    if: needs.path-filter.outputs.needs_rust_checks == 'true' || needs.path-filter.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt,clippy

      - name: Setup vx
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check canonical repository links
        run: vx just check-repository-links

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-quick-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-quick-

      - name: Check Rust formatting
        if: needs.path-filter.outputs.needs_rust_checks == 'true'
        run: cargo fmt --all -- --check

      - name: Audit unsafe usage
        if: needs.path-filter.outputs.needs_rust_checks == 'true'
        run: vx just unsafe-audit

      - name: Check host-adapter contract Rust/Python capability parity
        # Must also run for Python-only changes: the guard's whole job is
        # catching drift between the Rust and Python declarations, and a
        # Python-only edit to `adapter/backends.py` is one of the two ways
        # that drift happens. Gating it on `needs_rust_checks` alone would
        # skip exactly that case.
        if: needs.path-filter.outputs.needs_rust_checks == 'true' || needs.path-filter.outputs.needs_python_tests == 'true'
        run: vx python scripts/ci/check_contract_capability_parity.py

      - name: Install system dependencies
        if: needs.path-filter.outputs.needs_rust_checks == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Build frontend assets (required by auroraview-assets)
        if: needs.path-filter.outputs.needs_rust_checks == 'true'
        run: vx just ci-assets-build

      - name: Check Python formatting (ruff)
        if: needs.path-filter.outputs.python == 'true' || needs.path-filter.outputs.ci == 'true'
        run: vx uvx ruff check python/ tests/ && vx uvx ruff format --check python/ tests/

      - name: Cargo check (fast compile check)
        if: needs.path-filter.outputs.needs_rust_checks == 'true'
        run: cargo check --workspace --all-targets --all-features --locked

  # =============================================================================
  # Clippy - Rust linting (parallel with quick-checks)
  # =============================================================================
  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [path-filter]
    if: needs.path-filter.outputs.needs_rust_checks == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Rust
        # async-trait 0.1.89 triggers double_must_use on Clippy 1.99.
        # Pin this lint job to 1.98.0 while retaining strict -D warnings.
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Setup vx helpers
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'just bun'
          cache: 'false'

      - name: Build frontend assets (required by auroraview-assets)
        run: vx just ci-assets-build

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # =============================================================================
  # SDK Build - TypeScript SDK (parallel, no dependencies)
  # =============================================================================
  sdk-build:
    name: SDK CI
    needs: [path-filter]
    if: needs.path-filter.outputs.needs_sdk_build == 'true'
    uses: ./.github/workflows/sdk-ci.yml
    with:
      artifact-prefix: 'pr-'
    secrets: inherit

  # =============================================================================
  # Pre-build Wheels - Build ABI3 wheels for all platforms
  # Only runs when code changes require wheel rebuild
  # =============================================================================
  pre-build:
    name: Pre-build Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: [path-filter, sdk-build]
    if: |
      always() &&
      (needs.path-filter.outputs.needs_wheel == 'true') &&
      (needs.sdk-build.result == 'success' || needs.sdk-build.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            artifact-name: wheels-linux-x86_64
            maturin-args: '--release --out dist --find-interpreter --features python-bindings,ext-module,abi3-py38'
          - os: windows-latest
            target: x64
            artifact-name: wheels-windows-x64
            maturin-args: '--release --out dist --find-interpreter --features python-bindings,ext-module,abi3-py38,win-webview2'
          - os: macos-latest
            target: universal2-apple-darwin
            artifact-name: wheels-macos-universal2-apple-darwin
            # Note: --sdist removed to avoid 100MB PyPI limit in releases
            maturin-args: '--release --out dist --find-interpreter --features python-bindings,ext-module,abi3-py38'
    steps:
      - uses: actions/checkout@v7

      - name: Download SDK assets
        if: needs.sdk-build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: pr-sdk-assets
          path: crates/auroraview-core/src/assets/js/

      - name: Build and Test Wheel
        uses: ./.github/actions/build-wheel
        with:
          target: ${{ matrix.target }}
          python-version: '3.11'
          maturin-args: ${{ matrix.maturin-args }}
          test-wheel: 'true'
          artifact-name: ${{ matrix.artifact-name }}

  # =============================================================================
  # Python 3.7 Test - Separate build for Python 3.7 compatibility
  # =============================================================================
  python37-test:
    name: Python 3.7 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: [path-filter]
    if: needs.path-filter.outputs.needs_python_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64
            artifact-name: wheels-linux-x86_64-py37
            maturin-args: '--release --out dist -i python3.7 --features python-bindings,ext-module'
          - os: windows-2022
            target: x64
            artifact-name: wheels-windows-x64-py37
            maturin-args: '--release --out dist -i python3.7 --features python-bindings,ext-module,win-webview2'
    steps:
      - uses: actions/checkout@v7

      - name: Build Python 3.7 Wheel
        uses: ./.github/actions/build-wheel
        with:
          target: ${{ matrix.target }}
          python-version: '3.7'
          rust-version: '1.95.0'
          maturin-args: ${{ matrix.maturin-args }}
          test-wheel: 'true'
          artifact-name: ${{ matrix.artifact-name }}
          use-sccache: 'false'

      # Run unit tests on Python 3.7 to catch encoding and compatibility issues
      - name: Run Python 3.7 Unit Tests
        shell: bash
        env:
          CI: 'true'
          AURORAVIEW_READY_TIMEOUT: '5'
        run: |
          # Install test dependencies (pytest only, no Qt for 3.7)
          pip install pytest pytest-cov pytest-timeout

          # Install the built wheel
          wheel_file=$(ls -t dist/*.whl | head -1)
          echo "Installing wheel: $wheel_file"
          pip install "$wheel_file"

          # Install the optional dcc-mcp extra so the DCC-MCP integration tests
          # actually execute on 3.7 instead of silently skipping. Without this
          # the py37 gate is vacuous for that code path.
          echo "Installing dcc-mcp-core for the auroraview[dcc-mcp] extra"
          pip install "dcc-mcp-core>=0.20.25,<0.21"
          python -c "import dcc_mcp_core, sys; print('dcc_mcp_core', dcc_mcp_core.__version__ if hasattr(dcc_mcp_core,'__version__') else 'ok', 'on', sys.version)"

          # Run unit tests (skip Qt tests as PySide6 doesn't support Python 3.7)
          pytest tests/python/unit/ \
            tests/test_thread_dispatcher.py \
            tests/test_thread_safety_diagnosis.py \
            -v --tb=short --timeout=60 \
            --ignore=tests/python/unit/test_qt_signals.py \
            -k "not qt"

      # The DCC-MCP discovery proof lives in integration tests (FileRegistry
      # registration, heartbeat, sentinel, skill load). Run them on 3.7 too,
      # otherwise the py37 gate only covers the adapter's pure-Python surface.
      - name: Run Python 3.7 DCC-MCP Integration Tests
        shell: bash
        env:
          CI: 'true'
        run: |
          pytest tests/python/integration/test_dcc_mcp_registration.py \
            tests/python/integration/test_dcc_mcp_coexistence.py \
            tests/python/integration/test_dcc_mcp_skill_isolation.py \
            tests/python/integration/test_dcc_mcp_tool_invocation.py \
            -v --tb=short --timeout=300

          # Fail loudly if the extra is missing: a skipped DCC-MCP suite must
          # never be mistaken for a passing one.
          python - <<'PY'
          import importlib.util
          if importlib.util.find_spec("dcc_mcp_core") is None:
              raise SystemExit(
                  "dcc-mcp-core is not installed; the DCC-MCP tests would "
                  "silently skip and the py37 gate would be vacuous."
              )
          print("dcc-mcp-core present: DCC-MCP tests were really executed")
          PY

  # =============================================================================
  # Rust Tests - With coverage reporting
  # =============================================================================
  rust-tests:
    name: Rust Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [path-filter, quick-checks]
    if: |
      always() &&
      needs.path-filter.outputs.needs_rust_checks == 'true' &&
      (needs.quick-checks.result == 'success' || needs.quick-checks.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Setup Rust with llvm-tools
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview

      - name: Setup Python (required for pyo3 linking in coverage)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Setup vx helpers
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'just bun'
          cache: 'false'

      - name: Verify MSRV Rust and bundled LLVM tools
        run: |
          set -euo pipefail
          # Use the runner toolchain installed above, including its LLVM binaries.
          # The VX provider's private stable sysroot is a separate toolchain.
          export RUSTUP_HOME="$HOME/.rustup"
          export RUSTUP_TOOLCHAIN="1.95.0"
          test -d "$RUSTUP_HOME"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"

          # VX 0.9.33 checks its manager store even with --use-system-path.
          # Keep vx just orchestration and use only this installed CI executable.
          AURORAVIEW_CI_RUSTUP="$(command -v rustup)"
          case "$AURORAVIEW_CI_RUSTUP" in
            /*) ;;
            *) echo "::error::rustup must resolve to an absolute path"; exit 1 ;;
          esac
          test -x "$AURORAVIEW_CI_RUSTUP"
          export AURORAVIEW_CI_RUSTUP
          echo "AURORAVIEW_CI_RUSTUP=$AURORAVIEW_CI_RUSTUP" >> "$GITHUB_ENV"

          MSRV_RUSTC="$("$AURORAVIEW_CI_RUSTUP" run 1.95.0 rustc --version)"
          case "$MSRV_RUSTC" in
            "rustc 1.95.0 "*) echo "$MSRV_RUSTC" ;;
            *) echo "::error::expected Rust 1.95.0, got $MSRV_RUSTC"; exit 1 ;;
          esac
          "$AURORAVIEW_CI_RUSTUP" run 1.95.0 rustc -vV
          MSRV_SYSROOT="$("$AURORAVIEW_CI_RUSTUP" run 1.95.0 rustc --print sysroot)"
          MSRV_HOST="$("$AURORAVIEW_CI_RUSTUP" run 1.95.0 rustc -vV | awk '/^host:/ {print $2}')"
          MSRV_BIN="$MSRV_SYSROOT/lib/rustlib/$MSRV_HOST/bin"
          for tool in llvm-profdata llvm-cov; do
            if [ ! -x "$MSRV_BIN/$tool" ]; then
              echo "::error::$tool missing from Rust 1.95.0 sysroot ($MSRV_BIN)"
              exit 1
            fi
            "$MSRV_BIN/$tool" --version
          done
      - name: Build frontend assets (required by auroraview-assets)
        run: vx just ci-assets-build

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests with coverage
        run: vx just ci-rust-coverage-lcov-msrv

      - name: Verify Rust coverage report
        if: runner.os == 'Linux'
        run: |
          # Guard against a silently degraded signal: the lane must prove the report step
          # really produced an lcov file, not just that the recipe exited zero.
          if [ ! -s rust-coverage.lcov ]; then
            echo "::error::rust-coverage.lcov was not produced (missing or empty)"
            exit 1
          fi
          echo "[OK] rust-coverage.lcov produced: $(wc -l < rust-coverage.lcov) lines, $(wc -c < rust-coverage.lcov) bytes"
          head -5 rust-coverage.lcov

      - name: Run doc tests
        run: vx just ci-docs-rust-msrv

      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-nextest-junit
          path: target/nextest/ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Rust coverage
        uses: codecov/codecov-action@v6

        with:
          files: rust-coverage.lcov
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # =============================================================================
  # Python Tests - Using pre-built ABI3 wheels (Python 3.8+)
  # =============================================================================
  python-tests:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [path-filter, quick-checks, pre-build]
    if: |
      always() &&
      needs.path-filter.outputs.needs_python_tests == 'true' &&
      (needs.quick-checks.result == 'success' || needs.quick-checks.result == 'skipped') &&
      needs.pre-build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Reduce matrix size - test edge versions on all platforms, middle versions on Linux only
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.10"
        include:
          - os: ubuntu-latest
            artifact-name: wheels-linux-x86_64
          - os: windows-latest
            artifact-name: wheels-windows-x64
          - os: macos-latest
            artifact-name: wheels-macos-universal2-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download pre-built wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.os == 'ubuntu-latest' && 'wheels-linux-x86_64' || matrix.os == 'windows-latest' && 'wheels-windows-x64' || 'wheels-macos-universal2-apple-darwin' }}
          path: dist/

      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          wheel_file=$(ls -t dist/*.whl | head -1)
          echo "Installing wheel: $wheel_file"
          pip install "$wheel_file"
          # PySide6<6.7 doesn't support Python 3.13+, use PySide6>=6.8 for Python 3.13+
          if python -c "import sys; exit(0 if sys.version_info >= (3, 13) else 1)"; then
            pip install pytest pytest-cov pytest-timeout qtpy "PySide6>=6.8"
          else
            pip install pytest pytest-cov pytest-timeout qtpy "PySide6<6.7"
          fi

      - name: Verify import
        shell: bash
        run: |
          python -c "import auroraview; print(f'AuroraView {auroraview.__version__} on Python ${{ matrix.python-version }}')"

      - name: Run tests
        shell: bash
        env:
          QT_API: pyside6
          CI: 'true'
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          AURORAVIEW_READY_TIMEOUT: '5'
        run: |
          pytest tests/python/unit/ \
            tests/test_thread_dispatcher.py \
            tests/test_thread_safety_diagnosis.py \
            -v --tb=short --cov=auroraview --cov-report=xml --timeout=60

      - name: Upload coverage (3.11 on ubuntu only)
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          flags: python,py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # =============================================================================
  # Wheel Validation - Test pre-built wheels
  # =============================================================================
  wheel-build:
    name: Wheel Validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: [path-filter, quick-checks, pre-build]
    if: |
      always() &&
      needs.path-filter.outputs.needs_wheel == 'true' &&
      (needs.quick-checks.result == 'success' || needs.quick-checks.result == 'skipped') &&
      needs.pre-build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: wheels-linux-x86_64
          - os: windows-latest
            artifact-name: wheels-windows-x64
          - os: macos-latest
            artifact-name: wheels-macos-universal2-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download pre-built wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/

      - name: Validate wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          wheel_file=$(ls -t dist/*.whl | head -1)
          echo "Installing wheel: $wheel_file"
          pip install "$wheel_file"
          python -c "import auroraview; print(f'Wheel validation OK: {auroraview.__version__}')"
          # Test CLI entry point
          auroraview --help || python -m auroraview --help || echo "CLI test skipped"

  # =============================================================================
  # Qt Integration Tests - Windows only (most critical platform)
  # =============================================================================
  qt-tests:
    name: Qt Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [path-filter, quick-checks, pre-build]
    if: |
      always() &&
      needs.path-filter.outputs.needs_python_tests == 'true' &&
      (needs.quick-checks.result == 'success' || needs.quick-checks.result == 'skipped') &&
      needs.pre-build.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download pre-built wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-windows-x64
          path: dist/

      - name: Install wheel and Qt dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          wheel_file=$(ls -t dist/*.whl | head -1)
          echo "Installing wheel: $wheel_file"
          pip install "$wheel_file"
          pip install qtpy "PySide6<6.7" pytest pytest-qt pytest-cov pytest-timeout

      - name: Run Qt tests (headless)
        shell: pwsh
        env:
          QT_API: pyside6
          CI: 'true'
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          AURORAVIEW_READY_TIMEOUT: '5'
        run: |
          pytest tests/python/integration/test_qt_backend.py tests/python/integration/test_qt_lifecycle.py -v --tb=short --timeout=60

      - name: Upload Qt coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          flags: python,qt,windows
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # =============================================================================
  # Performance Benchmark - Detect regressions (parallel)
  # =============================================================================
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [path-filter]
    if: needs.path-filter.outputs.needs_rust_checks == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Build benchmarks (compile-only smoke)
        # Only compile the registry bench; --no-run avoids running it. We do
        # not yet have a baseline-comparison script, so this guard is enough to
        # detect compile regressions in the bench targets without burning a
        # full workspace bench compile (which exceeds 15 min on cold caches).
        run: cargo bench --bench registry_bench --no-run

  # =============================================================================
  # CLI Build Test - Ensures CLI releases will work (parallel)
  # Uploads artifacts for reuse by gallery-pack job
  # =============================================================================
  cli-build:
    name: CLI Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [path-filter]
    if: needs.path-filter.outputs.needs_rust_checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: cli-linux-x86_64
            exe-name: auroraview-cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: cli-windows-x64
            exe-name: auroraview-cli.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact-name: cli-macos-arm64
            exe-name: auroraview-cli
    steps:
      - uses: actions/checkout@v7

      - name: Setup AuroraView Environment
        uses: ./.github/actions/setup-auroraview
        with:
          install-dependencies: 'false'
          cache-key-suffix: 'pr-cli-${{ matrix.target }}'

      - name: Build CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vx just ci-assets-build
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw 'Visual Studio installation with MSVC tools not found'
          }
          $vsDevCmd = Join-Path $installPath 'Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 && rustup target add ${{ matrix.target }} && cargo build -p auroraview-cli --release --target ${{ matrix.target }}"

      - name: Build CLI (Non-Windows)
        if: runner.os != 'Windows'
        run: vx just ci-cli-build ${{ matrix.target }}

      - name: Test CLI (--help)
        run: vx just ci-cli-smoke ${{ matrix.target }} ${{ matrix.exe-name }}

      # Upload CLI artifact for reuse by gallery-pack
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe-name }}
          retention-days: 1

  # =============================================================================
  # Gallery Frontend Build - Fast-fail frontend validation
  # Builds gallery/dist once and uploads it for reuse by downstream jobs
  # =============================================================================
  gallery-frontend:
    name: Gallery Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [path-filter, sdk-build]
    if: |
      always() &&
      needs.path-filter.outputs.needs_gallery_tests == 'true' &&
      (needs.sdk-build.result == 'success' || needs.sdk-build.result == 'skipped')
    steps:
      - uses: actions/checkout@v7

      - name: Setup AuroraView Environment
        uses: ./.github/actions/setup-auroraview
        with:
          install-dependencies: 'false'
          cache-key-suffix: 'pr-gallery-frontend'

      - name: Download SDK package
        if: needs.sdk-build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: pr-sdk-package
          path: packages/auroraview-sdk/dist/

      - name: Build SDK (fallback)
        if: needs.sdk-build.result == 'skipped'
        run: vx just sdk-build

      - name: Build Gallery frontend
        run: |
          vx just gallery-ci-install
          cd gallery
          vx bun run build

      - name: Upload Gallery frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: gallery-frontend-dist
          path: gallery/dist/
          retention-days: 1

  # =============================================================================
  # Gallery E2E Tests - Playwright tests
  # Reuses SDK build artifacts to avoid duplicate builds
  # =============================================================================
  gallery-e2e:
    name: Gallery E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [path-filter, sdk-build, gallery-frontend]
    if: |
      always() &&
      needs.path-filter.outputs.needs_gallery_tests == 'true' &&
      (needs.sdk-build.result == 'success' || needs.sdk-build.result == 'skipped') &&
      needs.gallery-frontend.result == 'success'
    steps:
      - uses: actions/checkout@v7

      - name: Setup AuroraView Environment
        uses: ./.github/actions/setup-auroraview
        with:
          install-dependencies: 'false'
          cache-key-suffix: 'pr-gallery-e2e'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Download pre-built SDK package if available
      - name: Download SDK package
        if: needs.sdk-build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: pr-sdk-package
          path: packages/auroraview-sdk/dist/

      # Build SDK only if sdk-build was skipped (no SDK changes)
      - name: Build SDK (fallback)
        if: needs.sdk-build.result == 'skipped'
        run: vx just sdk-build

      - name: Download Gallery frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: gallery-frontend-dist
          path: gallery/dist/

      - name: Install Gallery Playwright dependencies
        run: vx just gallery-ci-playwright-install

      - name: Run Gallery Playwright E2E tests
        run: vx just gallery-test-playwright


      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gallery-e2e-screenshots
          path: test-screenshots/
          retention-days: 7

      - name: Post screenshots to PR
        if: github.event_name == 'pull_request' && always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const screenshotsDir = 'test-screenshots';
            if (!fs.existsSync(screenshotsDir)) {
              console.log('No screenshots directory found');
              return;
            }

            const files = fs.readdirSync(screenshotsDir).filter(f => f.endsWith('.png'));
            if (files.length === 0) {
              console.log('No screenshots found');
              return;
            }

            // Get artifact URL
            const runId = context.runId;
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            // Build comment body
            let body = '## 📸 Gallery E2E Screenshots\n\n';
            body += `Screenshots from this PR's E2E tests. [View all artifacts](${artifactUrl})\n\n`;
            body += '| Page | Screenshot |\n';
            body += '|------|------------|\n';

            const pageNames = {
              'gallery_home': '🏠 Home',
              'gallery_getting_started': '🚀 Getting Started',
              'gallery_api_patterns': '💻 API Patterns',
              'gallery_window_features': '🪟 Window Features',
              'gallery_settings': '⚙️ Settings'
            };

            for (const file of files) {
              const name = file.replace('.png', '');
              const displayName = pageNames[name] || name;
              body += `| ${displayName} | [View](${artifactUrl}) |\n`;
            }

            body += '\n<details><summary>ℹ️ How to view screenshots</summary>\n\n';
            body += '1. Click "View all artifacts" above\n';
            body += '2. Scroll to "Artifacts" section\n';
            body += '3. Download `gallery-e2e-screenshots`\n';
            body += '</details>';

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Gallery E2E Screenshots')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # =============================================================================
  # Gallery Pack Build Test - Ensures gallery packaging works
  # Reuses CLI and SDK build artifacts to avoid duplicate builds
  # =============================================================================
  gallery-pack:
    name: Gallery Pack Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: [path-filter, cli-build, pre-build, sdk-build, gallery-frontend]
    if: |
      always() &&
      needs.path-filter.outputs.needs_gallery_tests == 'true' &&
      (needs.cli-build.result == 'success' || needs.cli-build.result == 'skipped') &&
      (needs.pre-build.result == 'success' || needs.pre-build.result == 'skipped') &&
      needs.gallery-frontend.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe-ext: .exe
            exe-name: auroraview-cli.exe
            wheel-artifact: wheels-windows-x64
            cli-artifact: cli-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe-ext: ''
            exe-name: auroraview-cli
            wheel-artifact: wheels-linux-x86_64
            cli-artifact: cli-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            exe-ext: ''
            exe-name: auroraview-cli
            wheel-artifact: wheels-macos-universal2-apple-darwin
            cli-artifact: cli-macos-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Setup AuroraView Environment
        uses: ./.github/actions/setup-auroraview
        with:
          install-dependencies: 'false'
          cache-key-suffix: 'pr-gallery-pack-${{ matrix.target }}'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download pre-built auroraview wheel
        if: needs.pre-build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.wheel-artifact }}
          path: dist/

      - name: Install auroraview wheel
        if: needs.pre-build.result == 'success'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          wheel_file=$(ls -t dist/*.whl | head -1)
          echo "Installing wheel: $wheel_file"
          pip install "$wheel_file"
          python -c "import auroraview; print(f'auroraview {auroraview.__version__} installed')"

      # Download pre-built CLI from cli-build job
      - name: Download pre-built CLI
        if: needs.cli-build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.cli-artifact }}
          path: cli-bin/

      - name: Setup pre-built CLI
        if: needs.cli-build.result == 'success'
        shell: bash
        run: |
          mkdir -p target/${{ matrix.target }}/release
          cp cli-bin/${{ matrix.exe-name }} target/${{ matrix.target }}/release/
          chmod +x target/${{ matrix.target }}/release/${{ matrix.exe-name }} || true
          echo "Using pre-built CLI:"
          ls -la target/${{ matrix.target }}/release/${{ matrix.exe-name }}

      # Install runtime libraries for Linux (always needed to run CLI)
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libgtk-3-0

      # Fallback: Build CLI only if cli-build was skipped
      - name: Build CLI (fallback, Windows)
        if: needs.cli-build.result == 'skipped' && runner.os == 'Windows'
        shell: pwsh
        run: |
          vx just ci-assets-build
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw 'Visual Studio installation with MSVC tools not found'
          }
          $vsDevCmd = Join-Path $installPath 'Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 && rustup target add ${{ matrix.target }} && cargo build -p auroraview-cli --release --target ${{ matrix.target }}"

      - name: Build CLI (fallback, Non-Windows)
        if: needs.cli-build.result == 'skipped' && runner.os != 'Windows'
        run: vx just ci-cli-build ${{ matrix.target }}

      # Download pre-built SDK package if available
      - name: Download SDK package
        if: needs.sdk-build.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: pr-sdk-package
          path: packages/auroraview-sdk/dist/

      - name: Download Gallery frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: gallery-frontend-dist
          path: gallery/dist/

      # Build SDK only if sdk-build was skipped
      - name: Build SDK (fallback)
        if: needs.sdk-build.result == 'skipped'
        run: vx just sdk-build

      - name: Pack Gallery (generate executable)
        shell: bash
        env:
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu:${{ env.LD_LIBRARY_PATH }}
        run: |
          ./target/${{ matrix.target }}/release/auroraview-cli${{ matrix.exe-ext }} pack \
            --config gallery/auroraview.pack.toml \
            --output-dir target/pack

      - name: Verify pack output
        shell: bash
        run: |
          echo "Checking pack output..."
          ls -la target/pack/
          # Pack now outputs executable directly, not a project directory
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            expected_exe="target/pack/auroraview-gallery.exe"
          else
            expected_exe="target/pack/auroraview-gallery"
          fi
          if [ -f "$expected_exe" ]; then
            echo "Pack executable generated successfully: $expected_exe"
            ls -la "$expected_exe"
          else
            echo "ERROR: Pack executable not found: $expected_exe"
            exit 1
          fi

      # Test that the packed executable can start and Python backend initializes correctly
      # This catches issues like missing _core.pyd that only manifest at runtime
      - name: Test packed executable startup
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          $exe = "target/pack/auroraview-gallery.exe"
          Write-Host "Testing packed executable startup: $exe"

          # Start the process
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden

          # Wait up to 15 seconds for startup
          $timeout = 15
          for ($i = 0; $i -lt $timeout; $i++) {
            Start-Sleep -Seconds 1
            Write-Host "Waiting for startup... ($i/$timeout seconds)"

            # Check if process exited with error
            if ($process.HasExited) {
              if ($process.ExitCode -ne 0) {
                Write-Host "ERROR: Process exited with code $($process.ExitCode)"
                exit 1
              }
              Write-Host "Process exited normally"
              break
            }
          }

          # If still running after timeout, consider it a success and kill it
          if (-not $process.HasExited) {
            Write-Host "SUCCESS: Packed executable started and running for $timeout seconds"
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Test packed executable startup (Unix)
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 2
        run: |
          exe="target/pack/auroraview-gallery"
          echo "Testing packed executable startup: $exe"

          # Make executable
          chmod +x "$exe"

          # On Linux, we need a virtual display for GTK
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb || true
            xvfb-run --auto-servernum "$exe" &
            PID=$!
          else
            # macOS - run directly
            "$exe" &
            PID=$!
          fi

          # Wait up to 15 seconds
          for i in {1..15}; do
            sleep 1
            echo "Waiting for startup... ($i/15 seconds)"

            if ! kill -0 $PID 2>/dev/null; then
              wait $PID || EXIT_CODE=$?
              if [ "${EXIT_CODE:-0}" -ne 0 ]; then
                echo "ERROR: Process exited with code $EXIT_CODE"
                exit 1
              fi
              echo "Process exited normally"
              break
            fi
          done

          # If still running, success
          if kill -0 $PID 2>/dev/null; then
            echo "SUCCESS: Packed executable started and running for 15 seconds"
            kill $PID 2>/dev/null || true
          fi

      - name: Upload pack artifact
        uses: actions/upload-artifact@v7
        with:
          name: gallery-pack-${{ matrix.os }}
          path: target/pack/auroraview-gallery${{ matrix.exe-ext }}
          retention-days: 3

  # =============================================================================
  # Docs Build - Only for documentation changes
  # =============================================================================
  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [path-filter]
    if: needs.path-filter.outputs.needs_docs_build == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup AuroraView Environment
        uses: ./.github/actions/setup-auroraview
        with:
          install-dependencies: 'false'
          cache-key-suffix: 'pr-docs'

      - name: Build docs
        run: vx just ci-docs-build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-build
          path: docs/.vitepress/dist
          retention-days: 3

  # =============================================================================
  # Final Gate - All critical checks must pass
  # =============================================================================
  pr-ready:
    name: PR Ready
    runs-on: ubuntu-latest
    needs: [path-filter, pre-build, python37-test, quick-checks, clippy, python-tests, rust-tests, wheel-build, qt-tests, cli-build, gallery-frontend, gallery-e2e, gallery-pack, sdk-build, benchmark, docs-build]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Show what was detected
          echo "### 🔍 Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "- Rust: ${{ needs.path-filter.outputs.rust }}" >> $GITHUB_STEP_SUMMARY
          echo "- Python: ${{ needs.path-filter.outputs.python }}" >> $GITHUB_STEP_SUMMARY
          echo "- SDK: ${{ needs.path-filter.outputs.sdk }}" >> $GITHUB_STEP_SUMMARY
          echo "- Gallery: ${{ needs.path-filter.outputs.gallery }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docs: ${{ needs.path-filter.outputs.docs }}" >> $GITHUB_STEP_SUMMARY
          echo "- CI: ${{ needs.path-filter.outputs.ci }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📋 Job Results" >> $GITHUB_STEP_SUMMARY

          failed=0
          while IFS='|' read -r job result; do
            if [ "$result" = "success" ]; then
              echo "- ✅ $job" >> $GITHUB_STEP_SUMMARY
            elif [ "$result" = "skipped" ]; then
              echo "- ⏭️ $job (skipped - not needed)" >> $GITHUB_STEP_SUMMARY
            elif [ "$result" = "cancelled" ]; then
              echo "- ⚪ $job (cancelled)" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ $job ($result)" >> $GITHUB_STEP_SUMMARY
              # Only fail if the job was supposed to run (not skipped)
              if [ "$result" != "skipped" ]; then
                failed=1
              fi
            fi
          done <<'EOF'
          path-filter|${{ needs.path-filter.result }}
          pre-build|${{ needs.pre-build.result }}
          python37-test|${{ needs.python37-test.result }}
          quick-checks|${{ needs.quick-checks.result }}
          clippy|${{ needs.clippy.result }}
          python-tests|${{ needs.python-tests.result }}
          rust-tests|${{ needs.rust-tests.result }}
          wheel-build|${{ needs.wheel-build.result }}
          qt-tests|${{ needs.qt-tests.result }}
          cli-build|${{ needs.cli-build.result }}
          gallery-frontend|${{ needs.gallery-frontend.result }}
          gallery-e2e|${{ needs.gallery-e2e.result }}
          gallery-pack|${{ needs.gallery-pack.result }}
          sdk-build|${{ needs.sdk-build.result }}
          benchmark|${{ needs.benchmark.result }}
          docs-build|${{ needs.docs-build.result }}
          EOF

          if [ "$failed" -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **PR is not ready for merge**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **PR is ready for merge!**" >> $GITHUB_STEP_SUMMARY
