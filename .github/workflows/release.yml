name: Release

# This workflow is the ONLY workflow that runs on main branch pushes.
# It handles:
# 1. Regular commits to main: Only runs release-please to check if a release PR should be created/updated
# 2. release-please PR merge: Creates a release tag and triggers the full release process
# 3. Tag push (auroraview-v*): Publishes to PyPI and creates GitHub Release
#
# Note: release-please creates tags in format "auroraview-v0.3.8" (component-v format)
#
# This design eliminates duplicate CI runs by:
# - Not triggering build-wheels.yml, build-cli.yml, ci.yml, codeql.yml on main push
# - Only running expensive builds when a release is actually created
# - Reusing PR artifacts when available to avoid redundant builds

on:
  push:
    branches:
      - main
    tags:
      - 'auroraview-v*'  # release-please tag format: auroraview-v0.3.8
  workflow_dispatch:
    inputs:
      force-rebuild:
        description: 'Force rebuild wheels instead of reusing PR artifacts'
        required: false
        type: boolean
        default: false

# Cancel in-progress runs for the same ref, but never cancel tag releases
# For main branch pushes: cancel previous runs to avoid duplicate release-please runs
# For tag pushes: do not cancel (each tag release must complete)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write # Required for creating releases and uploading artifacts
  pull-requests: write # Required for release-please
  issues: write # Required for release-please
  id-token: write # Required for PyPI and npm trusted publishing
  attestations: write # Required for artifact attestation
  actions: read # Required for downloading artifacts from other workflows

jobs:
  # First job: Run release-please to create releases and tags
  # This only runs on main branch pushes (not tag pushes)
  release-please:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Determine if this is a tag push (for publishing)
  check-tag:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/auroraview-v')
    outputs:
      is_tag: 'true'
      tag_name: ${{ github.ref_name }}
    steps:
      - name: Tag detected
        run: |
          echo "Tag push detected: ${{ github.ref_name }}"
          echo "This will trigger the full release process"

  # Try to find and download pre-built wheels from PR checks
  # Reuse an exact source SHA, or a merged PR head with the identical whole Git tree.
  check-pr-artifacts:
    name: Check PR Artifacts
    runs-on: ubuntu-latest
    needs: [release-please, check-tag]
    if: |
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
       (needs.check-tag.result == 'success' && needs.check-tag.outputs.is_tag == 'true')) &&
      !inputs.force-rebuild
    outputs:
      artifacts-available: ${{ steps.check.outputs.available }}
      pr-run-id: ${{ steps.check.outputs.run_id }}
      source-sha: ${{ steps.check.outputs.source_sha }}
      sdk-available: ${{ steps.check.outputs.sdk_available }}
      sdk-run-id: ${{ steps.check.outputs.sdk_run_id }}
      sdk-source-sha: ${{ steps.check.outputs.sdk_source_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Find verified PR artifacts for this tree
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            const targetSha = context.sha;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const candidates = [{ sha: targetSha }];
            const { data: target } = await github.rest.git.getCommit({ ...context.repo, commit_sha: targetSha });
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo, commit_sha: targetSha, per_page: 100,
            });
            for (const pull of pulls) {
              if (!pull.merged_at || pull.merge_commit_sha !== targetSha || pull.base.ref !== 'main' ||
                  pull.head.repo?.full_name !== repository || pull.base.repo?.full_name !== repository ||
                  pull.head.sha === targetSha) continue;
              const { data: source } = await github.rest.git.getCommit({ ...context.repo, commit_sha: pull.head.sha });
              if (source.tree.sha === target.tree.sha) {
                candidates.push({ sha: pull.head.sha, branch: pull.head.ref });
                console.log(`PR #${pull.number} head ${pull.head.sha} has release tree ${target.tree.sha}`);
              }
            }

            core.setOutput('available', 'false');
            core.setOutput('sdk_available', 'false');
            let wheelsAvailable = false;
            let sdkAvailable = false;
            const wheelNames = [
              'wheels-linux-x86_64', 'wheels-windows-x64', 'wheels-macos-universal2-apple-darwin',
              'wheels-linux-x86_64-py37', 'wheels-windows-x64-py37',
            ];
            const sdkJobs = [
              'SDK CI / Type Check', 'SDK CI / Unit Tests (Node 20)', 'SDK CI / Unit Tests (Node 22)',
              'SDK CI / Coverage Report', 'SDK CI / Build Package', 'SDK CI / Build Assets',
              'SDK CI / E2E Tests', 'SDK CI / Gallery Integration', 'SDK CI / SDK Ready',
            ];

            for (const candidate of candidates) {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'pr-checks.yml', status: 'success',
                head_sha: candidate.sha, per_page: 10,
              });
              for (const run of runs.workflow_runs) {
                if (run.head_sha !== candidate.sha || run.status !== 'completed' || run.conclusion !== 'success' ||
                    run.head_repository?.full_name !== repository ||
                    (candidate.branch && run.head_branch !== candidate.branch)) continue;
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  ...context.repo, run_id: run.id, per_page: 100,
                });
                const hasArtifact = (name) => artifacts.some(a => a.name === name && a.expired === false && a.size_in_bytes > 0);
                if (!wheelsAvailable && wheelNames.every(hasArtifact)) {
                  wheelsAvailable = true;
                  core.setOutput('available', 'true');
                  core.setOutput('run_id', String(run.id));
                  core.setOutput('source_sha', candidate.sha);
                }
                if (!sdkAvailable && hasArtifact('pr-sdk-npm-consumer')) {
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
                  });
                  if (sdkJobs.every(name => jobs.some(job => job.name === name && job.status === 'completed' && job.conclusion === 'success'))) {
                    sdkAvailable = true;
                    core.setOutput('sdk_available', 'true');
                    core.setOutput('sdk_run_id', String(run.id));
                    core.setOutput('sdk_source_sha', candidate.sha);
                  }
                }
                if (wheelsAvailable && sdkAvailable) return;
              }
            }
            console.log(`Verified reuse: wheels=${wheelsAvailable}, sdk=${sdkAvailable}; unavailable stages will build`);

  # Download and re-upload artifacts from PR workflow (if available)
  reuse-pr-wheels:
    name: Reuse PR Wheels
    runs-on: ubuntu-latest
    needs: [release-please, check-tag, check-pr-artifacts]
    if: |
      always() &&
      needs.check-pr-artifacts.result == 'success' &&
      needs.check-pr-artifacts.outputs.artifacts-available == 'true' &&
      !inputs.force-rebuild
    strategy:
      matrix:
        artifact:
          - wheels-linux-x86_64
          - wheels-windows-x64
          - wheels-macos-universal2-apple-darwin
          - wheels-linux-x86_64-py37
          - wheels-windows-x64-py37
    steps:
      - name: Download artifact from PR workflow
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.check-pr-artifacts.outputs.pr-run-id }}

      - name: Re-upload artifact for release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Fallback: Build wheels if PR artifacts not available
  build-wheels:
    needs: [release-please, check-tag, check-pr-artifacts]
    if: |
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
       (needs.check-tag.result == 'success' && needs.check-tag.outputs.is_tag == 'true')) &&
      (needs.check-pr-artifacts.result != 'success' || needs.check-pr-artifacts.outputs.artifacts-available != 'true' || inputs.force-rebuild)
    uses: ./.github/workflows/build-wheels.yml
    with:
      test-wheel: ${{ 'false' }}
    permissions:
      contents: read
      actions: write
      id-token: write

  # Build CLI binaries for all platforms
  build-cli:
    needs: [release-please, check-tag]
    if: |
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
       (needs.check-tag.result == 'success' && needs.check-tag.outputs.is_tag == 'true'))
    uses: ./.github/workflows/build-cli.yml
    permissions:
      contents: read
      actions: write

  # Build Gallery standalone executables for all platforms
  build-gallery:
    needs: [release-please, check-tag]
    if: |
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
       (needs.check-tag.result == 'success' && needs.check-tag.outputs.is_tag == 'true'))
    uses: ./.github/workflows/build-gallery.yml
    permissions:
      contents: read
      actions: write
    secrets: inherit


  # Update Gallery screenshots in assets/images/
  # Non-essential — never block release if this fails.
  update-gallery-screenshots:
    name: Update Gallery Screenshots
    runs-on: ubuntu-latest
    needs: [release-please, check-tag]
    if: |
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
       (needs.check-tag.result == 'success' && needs.check-tag.outputs.is_tag == 'true'))
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup vx helpers
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ github.token }}
          tools: 'just bun'
          cache: 'false'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build Gallery frontend
        run: vx just gallery-ci-build

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Take Gallery screenshots
        run: |
          python scripts/test_gallery_e2e.py --screenshots-only --update-assets

      - name: Commit updated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet assets/images/; then
            echo "No screenshot changes detected"
          else
            git add assets/images/gallery_*.png
            git commit -m "docs: update gallery screenshots [skip ci]"
            git push
            echo "Screenshots updated and pushed"
          fi

  # Promote the exact npm archive already checked on an identical source tree.
  reuse-pr-sdk:
    name: Reuse PR SDK Archive
    runs-on: ubuntu-latest
    needs: [check-pr-artifacts]
    if: |
      always() &&
      needs.check-pr-artifacts.result == 'success' &&
      needs.check-pr-artifacts.outputs.sdk-available == 'true' &&
      !inputs.force-rebuild
    steps:
      - name: Download verified PR npm archive
        uses: actions/download-artifact@v8
        with:
          name: pr-sdk-npm-consumer
          path: npm-artifacts/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.check-pr-artifacts.outputs.sdk-run-id }}

      - name: Promote npm archive for release verification
        uses: actions/upload-artifact@v7
        with:
          name: release-sdk-npm-consumer
          path: npm-artifacts/
          if-no-files-found: error
          retention-days: 7

  # Build SDK only when a verified archive from the same tree is unavailable.
  build-sdk:
    name: SDK CI
    needs: [release-please, check-tag, check-pr-artifacts]
    if: |
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
       (needs.check-tag.result == 'success' && needs.check-tag.outputs.is_tag == 'true')) &&
      (needs.check-pr-artifacts.result != 'success' || needs.check-pr-artifacts.outputs.sdk-available != 'true' || inputs.force-rebuild)
    uses: ./.github/workflows/sdk-ci.yml
    with:
      artifact-prefix: 'release-'
    secrets: inherit

  # (Removed) `build-mcp` / MCP CI reusable workflow.
  # The Python `auroraview-mcp` package was retired in favour of the Rust
  # `crates/auroraview-mcp` adapter + `dcc-mcp-core`'s gateway — see #364.

  # Publish SDK to npm via OIDC Trusted Publishing.
  # No NPM_TOKEN needed — npm authenticates via GitHub's OIDC token (id-token: write).
  # Requires one-time setup: add this repo as a trusted publisher on npm's package page.
  # npm granular access tokens with write permission now expire after 90 days max (Nov 2025),
  # so OIDC trusted publishing is the only solution with no expiry.
  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release-please, check-tag, reuse-pr-sdk, build-sdk]
    if: |
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
       (needs.check-tag.result == 'success' && needs.check-tag.outputs.is_tag == 'true')) &&
      (needs.reuse-pr-sdk.result == 'success' || needs.build-sdk.result == 'success')
    environment:
      name: npm
      url: https://www.npmjs.com/package/@auroraview/sdk
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm trusted publishing CLI
        shell: bash
        run: npm install -g npm@11

      - name: Verify npm trusted publishing toolchain
        shell: bash
        run: |
          node --version
          npm --version

          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          function parse(version) {
            return version.split(".").map((part) => Number(part));
          }

          function atLeast(actual, minimum) {
            for (let index = 0; index < minimum.length; index += 1) {
              const actualPart = actual[index] || 0;
              const minimumPart = minimum[index] || 0;
              if (actualPart > minimumPart) return true;
              if (actualPart < minimumPart) return false;
            }
            return true;
          }

          const nodeVersion = process.versions.node;
          const npmVersion = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();

          if (!atLeast(parse(nodeVersion), [22, 14, 0])) {
            throw new Error(`npm trusted publishing requires Node >= 22.14.0; found ${nodeVersion}`);
          }

          if (!atLeast(parse(npmVersion), [11, 5, 1])) {
            throw new Error(`npm trusted publishing requires npm >= 11.5.1; found ${npmVersion}`);
          }
          NODE

      - name: Verify npm connectivity
        shell: bash
        run: |
          echo "Checking npm registry connectivity..."
          npm ping || echo "WARNING: npm ping failed (non-blocking)"

      - name: Verify package configuration
        shell: bash
        run: |
          cd packages/auroraview-sdk
          echo "Package: $(node -p 'require("./package.json").name')"
          echo "Version: $(node -p 'require("./package.json").version')"
          echo "Registry: $(node -p 'require("./package.json").publishConfig?.registry || "default"')"
          echo "Access: $(node -p 'require("./package.json").publishConfig?.access || "default"')"

      - name: Download verified npm archive
        uses: actions/download-artifact@v8
        with:
          name: release-sdk-npm-consumer
          path: npm-artifacts/

      - name: Verify npm archive and consumer receipt
        id: archive
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || needs.check-tag.outputs.tag_name }}
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const { appendFileSync, lstatSync, readFileSync, realpathSync } = require('node:fs');
          const path = require('node:path');

          const expected = JSON.parse(readFileSync('packages/auroraview-sdk/package.json', 'utf8'));
          assert.equal(expected.name, '@auroraview/sdk', 'Unexpected SDK package name');
          assert.equal(process.env.RELEASE_TAG, `auroraview-v${expected.version}`, 'Release tag and SDK version differ');
          const repository = `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`;
          assert.equal(expected.repository?.url, repository, 'SDK repository differs from publishing repository');

          const directory = realpathSync('npm-artifacts');
          const receiptPath = path.join(directory, 'sdk-package-receipt.json');
          assert(lstatSync(receiptPath).isFile(), 'Consumer receipt must be a regular file');
          const receipt = JSON.parse(readFileSync(receiptPath, 'utf8'));
          assert.equal(receipt.status, 'passed', 'Installed npm consumer validation did not pass');
          assert.equal(receipt.stage, 'complete', 'Consumer validation did not complete');
          assert.equal(receipt.offline_install, true, 'Archive was not tested offline');
          assert.equal(receipt.consumer_removed, true, 'Consumer cleanup did not pass');
          assert.equal(receipt.consumer?.package, expected.name, 'Receipt package name differs');
          assert.equal(receipt.consumer?.version, expected.version, 'Receipt package version differs');

          const filename = receipt.tarball?.filename;
          assert.equal(typeof filename, 'string', 'Receipt archive filename is missing');
          assert(/^[A-Za-z0-9][A-Za-z0-9._+-]*\.tgz$/.test(filename), 'Archive filename must be a contained tgz basename');
          assert.equal(filename, path.basename(filename), 'Archive path escapes the artifact directory');
          assert.equal(filename, path.win32.basename(filename), 'Archive path contains Windows separators');
          const archive = path.join(directory, filename);
          assert(lstatSync(archive).isFile(), 'Archive must be a regular file');
          assert.equal(path.dirname(realpathSync(archive)), directory, 'Archive resolves outside the artifact directory');
          const bytes = readFileSync(archive);
          assert.equal(bytes.length, receipt.tarball.size, 'Archive size differs from receipt');
          assert.match(receipt.tarball.sha256, /^[a-f0-9]{64}$/, 'Receipt SHA256 is invalid');
          assert.equal(createHash('sha256').update(bytes).digest('hex'), receipt.tarball.sha256, 'Archive SHA256 differs from receipt');
          const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
          assert.equal(receipt.tarball.integrity, integrity, 'Archive integrity differs from receipt');

          const metadata = JSON.parse(execFileSync('tar', ['-xOf', archive, 'package/package.json'], {
            encoding: 'utf8', timeout: 10000, maxBuffer: 1024 * 1024,
          }));
          assert.equal(metadata.name, expected.name, 'Packed package name differs');
          assert.equal(metadata.version, expected.version, 'Packed package version differs');
          assert.equal(metadata.repository?.url, repository, 'Packed repository differs from publishing repository');
          appendFileSync(process.env.GITHUB_OUTPUT, `path=${archive}\nversion=${expected.version}\nintegrity=${integrity}\n`);
          console.log(`Verified ${filename}: ${receipt.tarball.sha256}`);
          NODE

      - name: Publish to npm (OIDC Trusted Publishing)
        id: npm-publish
        shell: bash
        env:
          VERIFIED_ARCHIVE: ${{ steps.archive.outputs.path }}
          SDK_VERSION: ${{ steps.archive.outputs.version }}
          VERIFIED_INTEGRITY: ${{ steps.archive.outputs.integrity }}
        run: |
          VERSION="$SDK_VERSION"
          echo "Publishing @auroraview/sdk@$VERSION via OIDC trusted publishing..."

          if EXISTING_DIST=$(npm view "@auroraview/sdk@$VERSION" dist --json --registry https://registry.npmjs.org 2>/dev/null); then
            EXISTING_DIST="$EXISTING_DIST" node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const existing = JSON.parse(process.env.EXISTING_DIST);
          assert.equal(existing.integrity, process.env.VERIFIED_INTEGRITY, 'Immutable npm version conflicts with the verified archive');
          NODE
            echo "Version $VERSION already published with the verified archive integrity, skipping"
            echo "publish_result=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # OIDC trusted publishing: npm uses the GitHub-issued OIDC token
          # to authenticate — no NPM_TOKEN secret needed.
          # Prerequisite: trusted publisher configured on npm for this repo+workflow.
          publish_log=$(mktemp)
          set +e
          npm publish "$VERIFIED_ARCHIVE" --registry https://registry.npmjs.org --provenance --access public --ignore-scripts 2>&1 | tee "$publish_log"
          publish_status=${PIPESTATUS[0]}
          set -e

          if [ "$publish_status" -eq 0 ]; then
            echo "publish_result=success" >> "$GITHUB_OUTPUT"
            echo "Published @auroraview/sdk@$VERSION via OIDC trusted publishing"
            exit 0
          fi

          echo "publish_result=failed" >> "$GITHUB_OUTPUT"
          echo ""
          echo "========== npm publish FAILED (exit code $publish_status) =========="
          echo ""

          if grep -Eiq 'trusted publishing|trusted publisher|not linked' "$publish_log"; then
            echo "ERROR: Trusted publishing is not configured for this npm package/repository pair."
            echo ""
            echo "TO FIX — add this repo as a trusted publisher on npm:"
            echo "  1. Go to https://www.npmjs.com/package/@auroraview/sdk/access"
            echo "  2. Click 'Trusted Publishers' → 'Add Trusted Publisher'"
            echo "  3. Set: Owner=try-auroraview, Repository=auroraview, Workflow filename=release.yml, Environment=npm"
            echo "  4. Save, then re-run this workflow"
          elif grep -Eiq 'ENEEDAUTH|E401|authentication|must be logged in|not authorized' "$publish_log"; then
            echo "ERROR: npm authentication failed."
            echo ""
            echo "Make sure Trusted Publishing is configured (see above)."
            echo ""
            echo "NOTE: npm granular access tokens now have a max lifetime of 90 days."
            echo "Trusted Publishing (OIDC) is the only solution with no expiry."
            echo "See: https://github.blog/changelog/2025-09-29-npm-granular-access-token-max-expiration-90-days/"
          elif grep -qi 'EOTP' "$publish_log"; then
            echo "ERROR: npm is requesting a one-time password (EOTP)."
            echo ""
            echo "This should not happen with OIDC trusted publishing."
            echo "Check that the npm package's 2FA settings allow automation:"
            echo "  https://www.npmjs.com/package/@auroraview/sdk/access"
            echo "  Set 'Publishing access' → 'Require two-factor authentication for write actions'"
          else
            echo "See the publish log above for the full error output."
            echo ""
            echo "Known causes:"
            echo "  - Trusted publisher not configured (most common)"
            echo "  - Package name mismatch"
            echo "  - Version already exists (checked above)"
          fi
          echo ""
          exit "$publish_status"

      - name: NPM Publish Summary
        if: always()
        shell: bash
        run: |
          echo "## npm Publish Results" >> $GITHUB_STEP_SUMMARY
          RESULT="${{ steps.npm-publish.outputs.publish_result }}"
          if [ "$RESULT" == "success" ]; then
            echo "- Published @auroraview/sdk successfully via OIDC trusted publishing" >> $GITHUB_STEP_SUMMARY
          elif [ "$RESULT" == "skipped" ]; then
            echo "- Skipped: version already exists on npm" >> $GITHUB_STEP_SUMMARY
          else
            echo "- npm publish failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**npm token policy (Nov 2025):** all granular access tokens with write permission expire after 90 days max." >> $GITHUB_STEP_SUMMARY
            echo "**Solution:** Use OIDC trusted publishing — no tokens, no expiry, no rotation." >> $GITHUB_STEP_SUMMARY
            echo "Configure at: https://www.npmjs.com/package/@auroraview/sdk/access → Trusted Publishers" >> $GITHUB_STEP_SUMMARY
            echo "Owner: try-auroraview | Repository: auroraview | Workflow filename: release.yml | Environment: npm" >> $GITHUB_STEP_SUMMARY
          fi

  # (Removed) `mcp-pypi-publish` — the standalone `auroraview-mcp` PyPI package
  # is superseded by the Rust adapter crate shipped inside this repo (see #364).

  # Publish to PyPI - waits for either reused or built wheels
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release-please, check-tag, check-pr-artifacts, reuse-pr-wheels, build-wheels]
    if: |
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
       (needs.check-tag.result == 'success' && needs.check-tag.outputs.is_tag == 'true')) &&
      (needs.reuse-pr-wheels.result == 'success' || needs.build-wheels.result == 'success')
    environment:
      name: pypi
      url: https://pypi.org/p/auroraview
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          # Download wheel artifacts only
          # Artifact names: wheels-linux-x86_64, wheels-windows-x64, wheels-macos-universal2-apple-darwin, etc.
          # Note: build-sdk-assets (renamed from wheels-sdk-assets) won't match this pattern
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          ls -la dist/
          echo "Total files: $(ls -1 dist/ | wc -l)"

      - name: Remove non-wheel files and Linux wheels (not accepted by PyPI)
        run: |
          echo "Before cleanup:"
          ls -la dist/

          # Remove any directories that might have been accidentally included
          find dist -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true

          # Remove any .js files (shouldn't be here, but just in case)
          rm -f dist/*.js 2>/dev/null || true

          # Remove CLI tar.gz/zip files (they don't have version numbers in the name)
          # CLI files: auroraview-cli-linux-x64.tar.gz, auroraview-cli-macos-arm64.tar.gz, etc.
          rm -f dist/auroraview-cli-*.tar.gz || true
          rm -f dist/auroraview-cli-*.zip || true

          # Remove Gallery artifacts
          rm -f dist/auroraview-gallery-*.tar.gz || true
          rm -f dist/auroraview-gallery-*.zip || true

          # Remove sdist (tar.gz) to avoid 100MB PyPI limit
          # sdist often exceeds limit due to bundled assets and Rust code
          # Users can build from GitHub source if needed
          rm -f dist/*.tar.gz || true

          # Remove any other non-wheel files
          # Keep only .whl files
          find dist -maxdepth 1 -type f ! -name "*.whl" -delete || true

          # Remove linux_x86_64 wheels as PyPI doesn't accept them
          # These wheels require webkit2gtk at runtime and use non-standard platform tags
          # Linux users should install from GitHub Releases or build from source
          rm -f dist/*-linux_x86_64.whl || true

          echo "After cleanup (files for PyPI):"
          ls -la dist/

          # Verify we have wheels to publish
          wheel_count=$(ls dist/*.whl 2>/dev/null | wc -l)
          if [ "$wheel_count" -eq 0 ]; then
            echo "WARNING: No wheels found after cleanup!"
            echo "This may happen if all wheels are Linux-only (not accepted by PyPI)"
            exit 1
          fi
          echo "Found $wheel_count wheel(s) for PyPI upload"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true
          skip-existing: true  # Skip files that already exist on PyPI

  # Build standalone source distribution (optional, for GitHub Releases only)
  # This is separate from PyPI publish to avoid 100MB limit
  build-sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    needs: [release-please, check-tag]
    if: |
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
       (needs.check-tag.result == 'success' && needs.check-tag.outputs.is_tag == 'true'))
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        run: |
          # Build sdist only (no wheels)
          maturin sdist --out dist
          ls -la dist/

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  # Upload Release Assets - Preserves release-please changelog, only adds artifacts
  # Uses softprops/action-gh-release which preserves existing release body when only uploading files
  upload-release-assets:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [release-please, check-tag, check-pr-artifacts, pypi-publish, build-cli, build-gallery, reuse-pr-wheels, build-wheels, build-sdist]
    if: |
      always() &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
       (needs.check-tag.result == 'success' && needs.check-tag.outputs.is_tag == 'true')) &&
      (needs.reuse-pr-wheels.result == 'success' || needs.build-wheels.result == 'success' || needs.reuse-pr-wheels.result == 'skipped')
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Determine tag and version
        id: tag
        run: |
          if [ "${{ needs.release-please.outputs.tag_name }}" != "" ]; then
            TAG_NAME="${{ needs.release-please.outputs.tag_name }}"
          else
            TAG_NAME="${{ needs.check-tag.outputs.tag_name }}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          # Extract version from tag (auroraview-v0.3.8 -> 0.3.8)
          VERSION=$(echo "$TAG_NAME" | sed 's/auroraview-v//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: release-artifacts
          merge-multiple: true

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          name: cli-all-platforms
          path: cli-artifacts
        continue-on-error: true

      - name: Download Gallery artifacts
        uses: actions/download-artifact@v8
        with:
          name: gallery-all-platforms
          path: gallery-artifacts
        continue-on-error: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: sdist-artifacts
        continue-on-error: true

      - name: Rename artifacts with version
        run: |
          VERSION="${{ steps.tag.outputs.VERSION }}"
          echo "Renaming artifacts with version: $VERSION"

          # Ensure release-artifacts dir exists even if optional builds were skipped
          mkdir -p release-artifacts

          # Rename CLI artifacts to include version
          if [ -d "cli-artifacts" ]; then
            for file in cli-artifacts/*; do
              if [ -f "$file" ]; then
                basename=$(basename "$file")
                case "$basename" in
                  auroraview-cli-windows-x64.zip)
                    newname="auroraview-cli-${VERSION}-x86_64-pc-windows-msvc.zip"
                    ;;
                  auroraview-cli-windows-arm64.zip)
                    newname="auroraview-cli-${VERSION}-aarch64-pc-windows-msvc.zip"
                    ;;
                  auroraview-cli-linux-x64.tar.gz)
                    newname="auroraview-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                    ;;
                  auroraview-cli-linux-arm64.tar.gz)
                    newname="auroraview-cli-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                    ;;
                  auroraview-cli-macos-arm64.tar.gz)
                    newname="auroraview-cli-${VERSION}-aarch64-apple-darwin.tar.gz"
                    ;;
                  auroraview-cli-macos-x64.tar.gz)
                    newname="auroraview-cli-${VERSION}-x86_64-apple-darwin.tar.gz"
                    ;;
                  *)
                    newname=$(echo "$basename" | sed "s/auroraview-cli-/auroraview-cli-${VERSION}-/")
                    ;;
                esac
                mv "$file" "release-artifacts/$newname"
                echo "Renamed: $basename -> $newname"
              fi
            done
          fi

          # Rename Gallery artifacts to include version
          if [ -d "gallery-artifacts" ]; then
            for file in gallery-artifacts/*; do
              if [ -f "$file" ]; then
                basename=$(basename "$file")
                case "$basename" in
                  auroraview-gallery-windows-x64.zip)
                    newname="auroraview-gallery-${VERSION}-x86_64-pc-windows-msvc.zip"
                    ;;
                  auroraview-gallery-windows-arm64.zip)
                    newname="auroraview-gallery-${VERSION}-aarch64-pc-windows-msvc.zip"
                    ;;
                  auroraview-gallery-linux-x64.tar.gz)
                    newname="auroraview-gallery-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                    ;;
                  auroraview-gallery-linux-arm64.tar.gz)
                    newname="auroraview-gallery-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                    ;;
                  auroraview-gallery-macos-arm64.tar.gz)
                    newname="auroraview-gallery-${VERSION}-aarch64-apple-darwin.tar.gz"
                    ;;
                  auroraview-gallery-macos-x64.tar.gz)
                    newname="auroraview-gallery-${VERSION}-x86_64-apple-darwin.tar.gz"
                    ;;
                  *)
                    echo "Unexpected Gallery release asset: $basename" >&2
                    exit 1
                    ;;
                esac
                mv "$file" "release-artifacts/$newname"
                echo "Renamed: $basename -> $newname"
              fi
            done
          fi

          # Copy sdist to release artifacts
          if [ -d "sdist-artifacts" ]; then
            for file in sdist-artifacts/*.tar.gz; do
              if [ -f "$file" ]; then
                cp "$file" "release-artifacts/"
                echo "Added sdist: $(basename "$file")"
              fi
            done
          fi

          echo "Final release artifacts:"
          ls -la release-artifacts/

      # Upload assets to existing release created by release-please
      - name: Upload assets to existing release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          files: release-artifacts/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## Release Assets Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded to GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "- Wheels (Windows x64, macOS universal2, Linux x86_64)" >> $GITHUB_STEP_SUMMARY
          echo "- CLI binaries (x64 and ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "- Gallery binaries (x64 and ARM64)" >> $GITHUB_STEP_SUMMARY
          echo "- Source distribution (sdist)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded to PyPI" >> $GITHUB_STEP_SUMMARY
          echo "- Wheels (Windows x64 + macOS universal2 only)" >> $GITHUB_STEP_SUMMARY
          echo "- Note: Linux wheels excluded (non-standard tags, requires webkit2gtk)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Not Available" >> $GITHUB_STEP_SUMMARY
          echo "- ARM64 Python wheels (webkit2gtk/wry cross-compilation not feasible)" >> $GITHUB_STEP_SUMMARY
          echo "- ARM64 users: build from source or use CLI/Gallery ARM64 binaries" >> $GITHUB_STEP_SUMMARY
