name: Mutation Testing

# Runs cargo-mutants to detect undertested code.
# - On PRs: incremental mode (only mutate changed files)
# - Weekly: full scan on core crates
# - Manual: configurable via workflow_dispatch

on:
  # Weekly full mutation scan (Sunday 03:00 UTC)
  schedule:
    - cron: '0 3 * * 0'

  # PR incremental mutation testing (only changed Rust files)
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'crates/**/*.rs'
      - 'src/**/*.rs'
      - '.github/workflows/mutation-testing.yml'
      - 'scripts/ci/test_mutation_workflow.py'
      - 'scripts/ci/mutation_changed_files.py'
      - 'justfile'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mutation testing mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
          - crate
      crate:
        description: 'Crate to test (only for crate mode)'
        required: false
        default: 'auroraview-core'
        type: string
      shard:
        description: 'Shard index/count (e.g. 0/4) for parallel runs'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: '600'
  CARGO_NET_RETRY: '10'

jobs:
  # ===========================================================================
  # Incremental mutation testing (PR only - test mutations in changed files)
  # ===========================================================================
  incremental:
    name: Incremental Mutations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        # The root package's dcc-mcp-protocols dev dependency requires Rust 1.95.
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Setup vx
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'just bun'
          cache: 'false'

      - name: Build frontend assets
        run: vx just ci-assets-build

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,nextest

      - name: Test mutation workflow
        run: vx just test-mutation-workflow

      - name: Get changed Rust files
        id: changed
        run: |
          base=${{ github.event.pull_request.base.sha }}
          # --in-diff is cargo-mutants' supported incremental selector: it
          # mutates only lines touched by this PR, across all workspace crates.
          git diff "$base"..HEAD -- '*.rs' > mutation.diff
          files=$(git diff --name-only --diff-filter=ACMR "$base"..HEAD -- '*.rs' | grep -E '^(crates|src)/' || true)
          if [ -z "$files" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "windows_only=false" >> "$GITHUB_OUTPUT"
            echo "No Rust source files changed"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$files" > changed-files.txt
            # The incremental job runs on ubuntu-latest. If every changed Rust
            # line sits behind a target_os=windows cfg, it cannot be compiled or
            # exercised here, so classify the diff and defer to the native test.
            python3 scripts/ci/mutation_changed_files.py \
              --diff mutation.diff --files changed-files.txt --root . --output "$GITHUB_OUTPUT"
            echo "Changed files: $files"
          fi

      - name: Run incremental mutation testing
        if: steps.changed.outputs.skip != 'true' && steps.changed.outputs.windows_only != 'true'
        run: |
          # Preserve cargo-mutants failures through tee, including baseline errors.
          set -o pipefail
          # --file unions with .cargo/mutants.toml examine_globs (it cannot
          # narrow), and a hard-coded root-package filter examined only the
          # root crate's src/ipc/**, so changed files in sub-crates (e.g.
          # window_style.rs) were never mutated. --workspace brings all crates
          # into scope; --in-diff restricts mutants to this PR's changed lines.
          # cargo-mutants 27.1.0 forwards CLI --features to every per-package
          # `cargo test`, so pass test-helpers only when every member declares
          # it; otherwise crates without the feature fail the baseline build.
          feature_args=()
          if cargo metadata --no-deps --format-version 1 | jq -e '[.packages[] | .features | has("test-helpers")] | all' >/dev/null; then
            feature_args=(--features "test-helpers")
          fi
          cargo mutants --workspace --in-diff mutation.diff --no-shuffle --timeout 120 "${feature_args[@]}" -- --config-file .config/nextest.toml 2>&1 | tee mutants-output.txt

      - name: Explain Windows-only mutation skip
        if: steps.changed.outputs.skip != 'true' && steps.changed.outputs.windows_only == 'true'
        run: |
          {
            echo "## Mutation testing skipped (Windows-only changes)"
            echo ""
            echo "Every changed Rust line is behind a target_os=windows cfg."
            echo "The incremental mutation job runs on ubuntu-latest and cannot"
            echo "compile or exercise Windows-only code, so it is skipped instead of"
            echo "reporting a misleading result."
            echo ""
            echo "Authoritative check: Test native Windows background color"
            echo "(Windows runner) in pr-checks.yml via 'vx just test-window-background'."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parse mutation results
        if: steps.changed.outputs.skip != 'true' && steps.changed.outputs.windows_only != 'true' && always()
        id: results
        run: |
          count_mutants() {
            # grep prints 0 but exits 1 for an empty file; do not append another 0.
            count=$(grep -c "." "$1" 2>/dev/null || true)
            echo "${count:-0}"
          }
          caught=$(count_mutants mutants.out/caught.txt)
          missed=$(count_mutants mutants.out/missed.txt)
          timeout=$(count_mutants mutants.out/timeout.txt)
          unviable=$(count_mutants mutants.out/unviable.txt)
          score=N/A
          if [ "$((caught + missed))" -gt 0 ]; then
            score="$(( caught * 100 / (caught + missed) ))%"
          fi
          echo "caught=$caught" >> "$GITHUB_OUTPUT"
          echo "missed=$missed" >> "$GITHUB_OUTPUT"
          echo "timeout=$timeout" >> "$GITHUB_OUTPUT"
          echo "unviable=$unviable" >> "$GITHUB_OUTPUT"
          echo "score=$score" >> "$GITHUB_OUTPUT"

      - name: Comment PR with mutation results
        if: steps.changed.outputs.skip != 'true' && steps.changed.outputs.windows_only != 'true' && always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const caught = '${{ steps.results.outputs.caught }}';
            const missed = '${{ steps.results.outputs.missed }}';
            const score = '${{ steps.results.outputs.score }}';
            const timeout = '${{ steps.results.outputs.timeout }}';

            let body = '## Mutation Testing Results\n\n';
            body += `| Metric | Value |\n|--------|-------|\n`;
            body += `| Caught | ${caught} |\n`;
            body += `| Missed | ${missed} |\n`;
            body += `| Timeout | ${timeout} |\n`;
            body += `| **Score** | **${score}** |\n\n`;

            if (score === 'N/A') {
              body += 'No mutants completed. Check the mutation testing step for baseline or setup errors.\n';
            } else if (parseInt(missed) > 0) {
              body += '> Some mutations survived. Consider adding tests for the affected code paths.\n';
              body += '<details><summary>Missed mutants</summary>\n\n```\n';
              const fs = require('fs');
              if (fs.existsSync('mutants.out/missed.txt')) {
                body += fs.readFileSync('mutants.out/missed.txt', 'utf-8').substring(0, 3000);
              }
              body += '\n```\n</details>\n';
            } else if (parseInt(timeout) > 0) {
              body += 'Some mutations timed out. Check the mutation testing logs.\n';
            } else {
              body += 'All mutations were caught by tests.\n';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Mutation Testing Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Write mutation results to step summary
        if: steps.changed.outputs.skip != 'true' && steps.changed.outputs.windows_only != 'true' && always()
        run: |
          {
            echo "## Mutation Testing Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Caught | ${{ steps.results.outputs.caught }} |"
            echo "| Missed | ${{ steps.results.outputs.missed }} |"
            echo "| Timeout | ${{ steps.results.outputs.timeout }} |"
            echo "| **Score** | **${{ steps.results.outputs.score }}** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-results-incremental
          path: mutants.out/
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # Full mutation testing (weekly schedule or manual trigger)
  # ===========================================================================
  full:
    name: Full Mutations (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full')
    strategy:
      fail-fast: false
      matrix:
        crate:
          - auroraview-signals
          - auroraview-protect
          - auroraview-core
          - auroraview-pack
          - auroraview-cli
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Setup vx
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'just bun'
          cache: 'false'

      - name: Build frontend assets
        run: vx just ci-assets-build

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-full-${{ matrix.crate }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-full-${{ matrix.crate }}-

      - name: Install cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,nextest

      - name: Run full mutation testing
        run: |
          # Only the root `auroraview` and `auroraview-desktop` packages define
          # `test-helpers`; passing it for any other package fails the unmutated
          # baseline with "does not contain this feature".
          feature_args=()
          if cargo metadata --no-deps --format-version 1 \
              | jq -e --arg c "${{ matrix.crate }}" \
                  '.packages[] | select(.name == $c) | .features | has("test-helpers")' >/dev/null; then
            feature_args=(--features "test-helpers")
          fi
          cargo mutants -p ${{ matrix.crate }} --no-shuffle --timeout 120 -- --config-file .config/nextest.toml "${feature_args[@]}"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-results-${{ matrix.crate }}
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore

  # ===========================================================================
  # Single crate mutation testing (manual dispatch)
  # ===========================================================================
  single-crate:
    name: Mutations (${{ github.event.inputs.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'crate'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Setup vx
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'just bun'
          cache: 'false'

      - name: Build frontend assets
        run: vx just ci-assets-build

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-${{ github.event.inputs.crate }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-${{ github.event.inputs.crate }}-

      - name: Install cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,nextest

      - name: Run mutation testing
        run: |
          shard_arg=""
          if [ -n "${{ github.event.inputs.shard }}" ]; then
            shard_arg="--shard ${{ github.event.inputs.shard }}"
          fi
          feature_args=()
          if cargo metadata --no-deps --format-version 1 \
              | jq -e --arg c "${{ github.event.inputs.crate }}" \
                  '.packages[] | select(.name == $c) | .features | has("test-helpers")' >/dev/null; then
            feature_args=(--features "test-helpers")
          fi
          cargo mutants -p ${{ github.event.inputs.crate }} $shard_arg --no-shuffle --timeout 120 -- --config-file .config/nextest.toml "${feature_args[@]}"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-results-${{ github.event.inputs.crate }}
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore
