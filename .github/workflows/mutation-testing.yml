name: Mutation Testing

# Runs cargo-mutants to detect undertested code.
# - On PRs: mutants on the changed Rust lines (--in-diff), split across 2 shards
# - Weekly: full scan on core crates
# - Manual: configurable via workflow_dispatch

on:
  # Weekly full mutation scan (Sunday 03:00 UTC)
  schedule:
    - cron: '0 3 * * 0'

  # PR incremental mutation testing (only changed Rust lines)
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'crates/**/*.rs'
      - 'src/**/*.rs'
      - '.github/workflows/mutation-testing.yml'
      - 'scripts/ci/test_mutation_workflow.py'
      - 'scripts/ci/mutation_changed_files.py'
      - 'justfile'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mutation testing mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
          - crate
      crate:
        description: 'Crate to test (only for crate mode)'
        required: false
        default: 'auroraview-core'
        type: string
      shard:
        description: 'Shard index/count (e.g. 0/4) for parallel runs'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: '600'
  CARGO_NET_RETRY: '10'

jobs:
  # ===========================================================================
  # Incremental mutation testing (PR only - mutate the lines changed by the PR)
  #
  # `--workspace --in-diff mutation.diff` is cargo-mutants' supported incremental
  # selector: --workspace brings every workspace crate into scope, --in-diff
  # restricts mutants to the lines touched by this PR. The old `--file` args
  # unioned with .cargo/mutants.toml examine_globs (they cannot narrow) and
  # skipped changed files in sub-crates entirely. The resulting planned set is
  # still split into two deterministic round-robin shards so a large diff never
  # truncates a leg; measured full rounds took 48-57 minutes with a 154-227s
  # baseline, so 60 minutes per leg leaves headroom without dropping work.
  # `Record shard context` plus the aggregate/parse/gate report job keep the
  # result honest when a leg is cancelled, incomplete or intentionally skipped.
  # ===========================================================================
  incremental:
    name: Incremental Mutations (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Run 40790621664 reached only 195/200 planned mutants at the 60-minute
    # job limit (baseline: 227s build + 4s test; later mutants: ~16-20s each).
    # Do NOT raise this cap: the planned --in-diff set is split across two
    # round-robin shards, so each leg handles roughly half. Worst-case budget:
    # 100 * 20s + 231s baseline + 4m setup + 15m variance headroom = ~56m.
    # Cancellation/partial results still fail the completeness gate below.
    timeout-minutes: 60
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false # collect every shard's mutants even if one fails
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        # cargo-mutants builds its unmutated baseline with `cargo test --no-run`,
        # which compiles dev-dependencies. Those pull dcc-mcp-protocols (git tag
        # v0.15.0) whose declared rust-version is 1.95, so the whole job needs
        # rustc >= 1.95. The *library* MSRV (1.90) only applies to production
        # wheels, which don't build dev-deps. Align with pr-checks Clippy, which
        # already builds the full workspace on this fixed 1.98.0 toolchain.
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Setup vx
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'just bun'
          cache: 'false'

      - name: Build frontend assets
        run: vx just ci-assets-build

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Scope per shard so the two legs never race to save the same key.
          key: ${{ runner.os }}-cargo-mutants-shard${{ matrix.shard }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-shard${{ matrix.shard }}-

      - name: Install cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,nextest

      # Exercise the real selector contracts before any mutation is planned.
      # `MutationChangedFiles` is the structure-independent half of the merged
      # #540 suite: the `MutationWorkflow` class binds main's single-job shape,
      # while this head keeps the two-shard + report-integrity shape. The
      # equivalent workflow wiring contracts are covered by the PR Checks
      # module tests/python/unit/test_mutation_in_diff_wiring.py.
      - name: Test mutation selector contracts
        run: |
          vx --with jq uv run --no-project --python 3.11 --with pyyaml \
            -m unittest discover -s scripts/ci -p test_mutation_workflow.py -k MutationChangedFiles -v

      - name: Get changed Rust files
        id: changed
        run: |
          base=${{ github.event.pull_request.base.sha }}
          # --in-diff is cargo-mutants' supported incremental selector: it
          # mutates only lines touched by this PR, across all workspace crates.
          git diff "$base"..HEAD -- '*.rs' > mutation.diff
          files=$(git diff --name-only --diff-filter=ACMR "$base"..HEAD -- '*.rs' | grep -E '^(crates|src)/' || true)
          if [ -z "$files" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "windows_only=false" >> "$GITHUB_OUTPUT"
            echo "No Rust source files changed"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$files" > changed-files.txt
            # The incremental job runs on ubuntu-latest. If every changed Rust
            # line sits behind a target_os=windows cfg, it cannot be compiled or
            # exercised here, so classify the diff and defer to the native test.
            python3 scripts/ci/mutation_changed_files.py \
              --diff mutation.diff --files changed-files.txt --root . --output "$GITHUB_OUTPUT"
            echo "Changed files: $files"
          fi

      - name: Run incremental mutation testing
        id: mutants
        if: steps.changed.outputs.skip != 'true' && steps.changed.outputs.windows_only != 'true'
        run: |
          # cargo-mutants 27.1.0 forwards CLI --features to every per-package
          # `cargo test`, so pass test-helpers only when every member declares
          # it; otherwise crates without the feature fail the baseline build.
          # --features must precede `--` to reach the baseline build command.
          feature_args=()
          if cargo metadata --no-deps --format-version 1 \
              | jq -e '[.packages[] | .features | has("test-helpers")] | all' >/dev/null; then
            feature_args=(--features "test-helpers")
          fi
          # Two deterministic round-robin shards split the --in-diff planned
          # set without truncation. Round-robin matters: measured times are ~8s
          # for the first 50 mutants and ~20s for the rest, so the default
          # `slice` algorithm would unbalance the legs; round-robin evens them.
          cargo mutants --workspace --in-diff mutation.diff --no-shuffle --shard ${{ matrix.shard }}/2 --sharding round-robin --timeout 120 "${feature_args[@]}" -- --config-file .config/nextest.toml 2>&1 | tee mutants-output.txt
          exit_code=${PIPESTATUS[0]}
          # Expose the real exit code as a step output. On cancellation the step
          # is killed before this line, so the output stays empty and the shard
          # context also receives outcome=cancelled / job.status=cancelled. Do
          # NOT `exit "$exit_code"` here: that would flip a completed `missed`
          # run (exit 2) into a failed step and change the existing quality gate.
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Explain Windows-only mutation skip
        if: steps.changed.outputs.skip != 'true' && steps.changed.outputs.windows_only == 'true'
        run: |
          {
            echo "## Mutation testing skipped (Windows-only changes)"
            echo ""
            echo "Every changed Rust line is behind a target_os=windows cfg."
            echo "The incremental mutation job runs on ubuntu-latest and cannot"
            echo "compile or exercise Windows-only code, so it is skipped instead of"
            echo "reporting a misleading result."
            echo ""
            echo "Authoritative check: Test native Windows background color"
            echo "(Windows runner) in pr-checks.yml via 'vx just test-window-background'."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record shard context
        id: context
        if: always()
        env:
          # Real runner contexts travel with the artifact so the aggregate job
          # can judge completeness without trusting a counter alone.
          SHARD_EXIT_CODE: ${{ steps.mutants.outputs.exit_code }}
          MUTANTS_STEP_OUTCOME: ${{ steps.mutants.outcome }}
          MUTANTS_STEP_CONCLUSION: ${{ steps.mutants.conclusion }}
          JOB_STATUS: ${{ job.status }}
          CHANGED_SKIP: ${{ steps.changed.outputs.skip }}
          CHANGED_WINDOWS_ONLY: ${{ steps.changed.outputs.windows_only }}
        run: |
          mkdir -p mutants.out
          # A Windows-only diff skips the mutants step but is an intentional
          # skip, not a partial leg: both shards must report skip=true so the
          # aggregate job suppresses the parser/gate instead of rejecting the
          # (legitimately empty) result set.
          effective_skip="$CHANGED_SKIP"
          if [ "$CHANGED_WINDOWS_ONLY" = "true" ]; then
            effective_skip=true
          fi
          printf '{"shard":%s,"shards":2,"exit_code":"%s","step_outcome":"%s","step_conclusion":"%s","job_status":"%s","skip":"%s","windows_only":"%s"}\n' \
            "${{ matrix.shard }}" "$SHARD_EXIT_CODE" "$MUTANTS_STEP_OUTCOME" \
            "$MUTANTS_STEP_CONCLUSION" "$JOB_STATUS" "$effective_skip" "$CHANGED_WINDOWS_ONLY" \
            > mutants.out/shard_meta.json

      - name: Record zero-candidate proof
        id: zero_candidates
        if: always() && steps.changed.outputs.skip != 'true'
        env:
          SHARD_EXIT_CODE: ${{ steps.mutants.outputs.exit_code }}
          MUTANTS_STEP_OUTCOME: ${{ steps.mutants.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          mkdir -p mutants.out
          # cargo-mutants 27.1.0 logs "No mutants to filter" when --in-diff
          # selects zero mutatable lines. That line is the producer's POSITIVE
          # evidence: absent artifacts alone could also mean a corrupt or lost
          # upload, and must never be mistaken for a legitimate empty set.
          zero=false
          if [ "$MUTANTS_STEP_OUTCOME" = "success" ] \
              && [ "$SHARD_EXIT_CODE" = "0" ] \
              && [ -f mutants-output.txt ] \
              && grep -qF "No mutants to filter" mutants-output.txt \
              && [ ! -e mutants.out/mutants.json ] \
              && [ ! -e mutants.out/outcomes.json ]; then
            zero=true
          fi
          diff_sha256=$(sha256sum mutation.diff | cut -d' ' -f1)
          # Ship the exact diff so the report job can recompute the hash and
          # bind the proof to this run's input, not just to a self-claim.
          cp mutation.diff mutants.out/mutation.diff
          printf '{"schema":1,"zero_candidates":%s,"shard":%s,"shards":2,"run_id":"%s","run_attempt":"%s","head_sha":"%s","diff_sha256":"%s","cargo_mutants_exit_code":"%s","no_mutants_signal":"No mutants to filter","mutants_found":0}\n' \
            "$zero" "$SHARD_INDEX" "$RUN_ID" "$RUN_ATTEMPT" "$HEAD_SHA" \
            "$diff_sha256" "$SHARD_EXIT_CODE" \
            > mutants.out/zero_candidates.json

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # Aggregate the two shards into ONE honest, complete result set (PR only)
  # ===========================================================================
  report:
    name: Mutation Report
    runs-on: ubuntu-latest
    needs: incremental
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Download shard results
        uses: actions/download-artifact@v7
        with:
          pattern: mutation-shard-*
          path: shards
          merge-multiple: false

      - name: Aggregate shard results
        id: aggregate
        if: always()
        env:
          # The matrix job's authoritative result. A cancelled/failed leg must
          # never be aggregated into a scored "complete" report.
          SHARD_RESULT: ${{ needs.incremental.result }}
        run: |
          python3 scripts/ci/aggregate_mutation_shards.py \
            --shards-dir shards \
            --output mutants.out \
            --expect-shards 2 \
            --shard-result "$SHARD_RESULT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      # A legitimate empty --in-diff set (changed Rust lines outside the
      # examined crates) produces zero mutants on both shards: cargo-mutants
      # logs "No mutants to filter", exits 0 and writes no mutants.json or
      # outcomes.json. Each shard uploads a run-bound zero_candidates.json
      # attestation plus the exact mutation.diff. The aggregator verifies that
      # proof and emits an explicit empty/skip N/A instead of `incomplete`;
      # corrupt, missing or stale artifacts without it stay rejected. The gate
      # is bypassed only for that verified shape -- never as a scored pass.
      - name: Report empty in-diff mutation set
        if: always() && steps.aggregate.outputs.empty == 'true'
        run: |
          {
            echo "## Mutation Testing Results"
            echo ""
            echo "**Status:** N/A (empty changed-line mutation set)"
            echo ""
            echo "Both mutation shards completed successfully with exit code 0, but"
            echo "the --in-diff selector produced no mutatable lines in the examined"
            echo "crates. There is no mutation score to report. This is an intentional"
            echo "N/A, not a failed, cancelled or all-caught result; the report gate"
            echo "is skipped only for this verified empty shape."
          } >> "$GITHUB_STEP_SUMMARY"

      # Parse via a unit-tested helper instead of inline `grep -c ... || echo 0`.
      # The old pattern returned "0\n0" on empty files (grep -c prints 0 AND
      # exits 1), which crashed $((caught + missed)) under `bash -e`, and a
      # missing/empty result set was reported as score=100 "all caught".
      - name: Parse mutation results
        if: always() && steps.aggregate.outputs.skip != 'true'
        id: results
        env:
          # The aggregate step derives these from the shards' persisted runner
          # contexts and the matrix result, so a cancelled/partial leg still
          # reaches the parser as an authoritative interruption signal.
          MUTANTS_EXIT_CODE: ${{ steps.aggregate.outputs.exit_code }}
          MUTANTS_STEP_OUTCOME: ${{ steps.aggregate.outputs.step_outcome }}
          MUTANTS_STEP_CONCLUSION: ${{ steps.aggregate.outputs.step_conclusion }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 scripts/ci/parse_mutation_results.py \
            --mutants-out mutants.out \
            --exit-code "$MUTANTS_EXIT_CODE" \
            --step-outcome "$MUTANTS_STEP_OUTCOME" \
            --step-conclusion "$MUTANTS_STEP_CONCLUSION" \
            --job-status "$JOB_STATUS" \
            --output "$GITHUB_OUTPUT" \
            --comment-file mutation-comment.md

      - name: Comment PR with mutation results
        if: always() && steps.aggregate.outputs.skip != 'true' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // The comment body is rendered by scripts/ci/parse_mutation_results.py,
            // which never claims a passing score for a failed/no-baseline run.
            const body = fs.existsSync('mutation-comment.md')
              ? fs.readFileSync('mutation-comment.md', 'utf-8')
              : '## Mutation Testing Results\n\nResult parsing produced no report; see the job log.\n';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Mutation Testing Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Write mutation results to step summary
        if: always() && steps.aggregate.outputs.skip != 'true'
        run: |
          {
            if [ -f mutation-comment.md ]; then
              cat mutation-comment.md
            else
              echo "## Mutation Testing Results"
              echo ""
              echo "Result parsing produced no report; see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A failed baseline, an error, a timeout, an incomplete (cancelled or
      # partial) run, zero mutants or missing results must fail the check. This
      # preserves the failure instead of publishing a false "all caught" pass.
      # A COMPLETED run with missed mutants is a valid, honestly scored result:
      # pass|missed means "usable report", NOT "quality passed". The repository
      # has no numeric mutation-score threshold; the earlier claim that missed
      # mutants fail via cargo-mutants' own exit code was inaccurate -- base
      # 8edc987 piped to tee, captured PIPESTATUS and never re-raised it.
      - name: Gate on valid mutation results
        if: always() && steps.aggregate.outputs.skip != 'true'
        env:
          MUTATION_STATUS: ${{ steps.results.outputs.status }}
          MUTATION_SUMMARY: ${{ steps.results.outputs.summary }}
        run: |
          echo "status=$MUTATION_STATUS"
          echo "summary=$MUTATION_SUMMARY"
          case "$MUTATION_STATUS" in
            pass|missed) echo "Valid mutation result: $MUTATION_STATUS (see comment)" ;;
            *) echo "::error::No valid mutation result ($MUTATION_STATUS): $MUTATION_SUMMARY"; exit 1 ;;
          esac

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-results-incremental
          path: mutants.out/
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # Full mutation testing (weekly schedule or manual trigger)
  # ===========================================================================
  full:
    name: Full Mutations (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full')
    strategy:
      fail-fast: false
      matrix:
        crate:
          - auroraview-signals
          - auroraview-protect
          - auroraview-core
          - auroraview-pack
          - auroraview-cli
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        # Full scan also builds dev-dependencies (dcc-mcp-protocols, MSRV 1.95),
        # so use the same fixed 1.98.0 toolchain as the incremental job.
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Setup vx
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'just bun'
          cache: 'false'

      - name: Build frontend assets
        run: vx just ci-assets-build

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-full-${{ matrix.crate }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-full-${{ matrix.crate }}-

      - name: Install cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,nextest

      - name: Run full mutation testing
        run: |
          # Only the root `auroraview` and `auroraview-desktop` packages define
          # `test-helpers`; passing it for any other package fails the unmutated
          # baseline with "does not contain this feature".
          feature_args=()
          if cargo metadata --no-deps --format-version 1 \
              | jq -e --arg c "${{ matrix.crate }}" \
                  '.packages[] | select(.name == $c) | .features | has("test-helpers")' >/dev/null; then
            feature_args=(--features "test-helpers")
          fi
          cargo mutants -p ${{ matrix.crate }} --no-shuffle --timeout 120 -- --config-file .config/nextest.toml "${feature_args[@]}"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-results-${{ matrix.crate }}
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore

  # ===========================================================================
  # Single crate mutation testing (manual dispatch)
  # ===========================================================================
  single-crate:
    name: Mutations (${{ github.event.inputs.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'crate'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        # Manual crate mode also builds dev-dependencies (dcc-mcp-protocols,
        # MSRV 1.95), so use the same fixed 1.98.0 toolchain as the other jobs.
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Setup vx
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'just bun'
          cache: 'false'

      - name: Build frontend assets
        run: vx just ci-assets-build

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-${{ github.event.inputs.crate }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-${{ github.event.inputs.crate }}-

      - name: Install cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,nextest

      - name: Run mutation testing
        run: |
          shard_arg=""
          if [ -n "${{ github.event.inputs.shard }}" ]; then
            shard_arg="--shard ${{ github.event.inputs.shard }}"
          fi
          feature_args=()
          if cargo metadata --no-deps --format-version 1 \
              | jq -e --arg c "${{ github.event.inputs.crate }}" \
                  '.packages[] | select(.name == $c) | .features | has("test-helpers")' >/dev/null; then
            feature_args=(--features "test-helpers")
          fi
          cargo mutants -p ${{ github.event.inputs.crate }} $shard_arg --no-shuffle --timeout 120 -- --config-file .config/nextest.toml "${feature_args[@]}"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-results-${{ github.event.inputs.crate }}
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore
