name: Mutation Testing

# Runs cargo-mutants to detect undertested code.
# - On PRs: incremental mode (only mutate changed files)
# - Weekly: full scan on core crates
# - Manual: configurable via workflow_dispatch

on:
  # Weekly full mutation scan (Sunday 03:00 UTC)
  schedule:
    - cron: '0 3 * * 0'

  # PR incremental mutation testing (only changed Rust files)
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'crates/**/*.rs'
      - 'src/**/*.rs'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mutation testing mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
          - crate
      crate:
        description: 'Crate to test (only for crate mode)'
        required: false
        default: 'auroraview-core'
        type: string
      shard:
        description: 'Shard index/count (e.g. 0/4) for parallel runs'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: '600'
  CARGO_NET_RETRY: '10'

jobs:
  # ===========================================================================
  # Incremental mutation testing (PR only - test mutations in changed files)
  # ===========================================================================
  incremental:
    name: Incremental Mutations
    runs-on: ubuntu-latest
    # The examined src/ipc/** set yields ~200 mutants, each costing ~12s
    # build + ~3s test, so a complete run needs roughly 50 minutes. The
    # former 30-minute cap cancelled step 10 mid-run (129/200 mutants
    # tested) and left the check cancelled despite a valid honest result.
    timeout-minutes: 60
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        # cargo-mutants builds its unmutated baseline with `cargo test --no-run`,
        # which compiles dev-dependencies. Those pull dcc-mcp-protocols (git tag
        # v0.15.0) whose declared rust-version is 1.95, so the whole job needs
        # rustc >= 1.95. The *library* MSRV (1.90) only applies to production
        # wheels, which don't build dev-deps. Align with pr-checks Clippy, which
        # already builds the full workspace on this fixed 1.98.0 toolchain.
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Setup vx
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'just bun'
          cache: 'false'

      - name: Build frontend assets
        run: vx just ci-assets-build

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-

      - name: Install cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,nextest

      - name: Get changed Rust files
        id: changed
        run: |
          files=$(git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }}..HEAD -- '*.rs' | grep -E '^(crates|src)/' | head -20 || true)
          if [ -z "$files" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No Rust source files changed"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            # Build --file args
            file_args=""
            for f in $files; do
              file_args="$file_args --file $f"
            done
            echo "file_args=$file_args" >> $GITHUB_OUTPUT
            echo "Changed files: $files"
          fi

      - name: Run incremental mutation testing
        if: steps.changed.outputs.skip != 'true'
        run: |
          # Without -p, cargo-mutants applies the args to every examined package;
          # only request `test-helpers` when all of them define it.
          feature_args=()
          if cargo metadata --no-deps --format-version 1 \
              | jq -e '[.packages[] | .features | has("test-helpers")] | all' >/dev/null; then
            feature_args=(--features "test-helpers")
          fi
          cargo mutants --no-shuffle --timeout 120 ${{ steps.changed.outputs.file_args }} -- --config-file .config/nextest.toml "${feature_args[@]}" 2>&1 | tee mutants-output.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_ENV

      # Parse via a unit-tested helper instead of inline `grep -c ... || echo 0`.
      # The old pattern returned "0\n0" on empty files (grep -c prints 0 AND
      # exits 1), which crashed $((caught + missed)) under `bash -e`, and a
      # missing/empty result set was reported as score=100 "all caught".
      - name: Parse mutation results
        if: steps.changed.outputs.skip != 'true' && always()
        id: results
        run: |
          python3 scripts/ci/parse_mutation_results.py \
            --mutants-out mutants.out \
            --exit-code "${exit_code:-}" \
            --output "$GITHUB_OUTPUT" \
            --comment-file mutation-comment.md

      - name: Comment PR with mutation results
        if: steps.changed.outputs.skip != 'true' && always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // The comment body is rendered by scripts/ci/parse_mutation_results.py,
            // which never claims a passing score for a failed/no-baseline run.
            const body = fs.existsSync('mutation-comment.md')
              ? fs.readFileSync('mutation-comment.md', 'utf-8')
              : '## Mutation Testing Results\n\nResult parsing produced no report; see the job log.\n';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Mutation Testing Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Write mutation results to step summary
        if: steps.changed.outputs.skip != 'true' && always()
        run: |
          {
            if [ -f mutation-comment.md ]; then
              cat mutation-comment.md
            else
              echo "## Mutation Testing Results"
              echo ""
              echo "Result parsing produced no report; see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A failed baseline, an error, a timeout, zero mutants or missing results
      # must fail the check. This preserves the failure instead of publishing a
      # blank "All mutations were caught" 100%-style pass. Real "missed" mutants
      # are reported (not hidden) and still fail via cargo-mutants' own exit code.
      - name: Gate on valid mutation results
        if: steps.changed.outputs.skip != 'true' && always()
        env:
          MUTATION_STATUS: ${{ steps.results.outputs.status }}
          MUTATION_SUMMARY: ${{ steps.results.outputs.summary }}
        run: |
          echo "status=$MUTATION_STATUS"
          echo "summary=$MUTATION_SUMMARY"
          case "$MUTATION_STATUS" in
            pass|missed) echo "Valid mutation result: $MUTATION_STATUS (see comment)" ;;
            *) echo "::error::No valid mutation result ($MUTATION_STATUS): $MUTATION_SUMMARY"; exit 1 ;;
          esac

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-results-incremental
          path: mutants.out/
          retention-days: 7
          if-no-files-found: ignore

  # ===========================================================================
  # Full mutation testing (weekly schedule or manual trigger)
  # ===========================================================================
  full:
    name: Full Mutations (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full')
    strategy:
      fail-fast: false
      matrix:
        crate:
          - auroraview-signals
          - auroraview-protect
          - auroraview-core
          - auroraview-pack
          - auroraview-cli
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        # Full scan also builds dev-dependencies (dcc-mcp-protocols, MSRV 1.95),
        # so use the same fixed 1.98.0 toolchain as the incremental job.
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Setup vx
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'just bun'
          cache: 'false'

      - name: Build frontend assets
        run: vx just ci-assets-build

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-full-${{ matrix.crate }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-full-${{ matrix.crate }}-

      - name: Install cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,nextest

      - name: Run full mutation testing
        run: |
          # Only the root `auroraview` and `auroraview-desktop` packages define
          # `test-helpers`; passing it for any other package fails the unmutated
          # baseline with "does not contain this feature".
          feature_args=()
          if cargo metadata --no-deps --format-version 1 \
              | jq -e --arg c "${{ matrix.crate }}" \
                  '.packages[] | select(.name == $c) | .features | has("test-helpers")' >/dev/null; then
            feature_args=(--features "test-helpers")
          fi
          cargo mutants -p ${{ matrix.crate }} --no-shuffle --timeout 120 -- --config-file .config/nextest.toml "${feature_args[@]}"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-results-${{ matrix.crate }}
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore

  # ===========================================================================
  # Single crate mutation testing (manual dispatch)
  # ===========================================================================
  single-crate:
    name: Mutations (${{ github.event.inputs.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'crate'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        # Manual crate mode also builds dev-dependencies (dcc-mcp-protocols,
        # MSRV 1.95), so use the same fixed 1.98.0 toolchain as the other jobs.
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libgtk-3-dev libglib2.0-dev libxdo-dev pkg-config

      - name: Setup vx
        uses: loonghao/vx@vx-v0.9.33
        with:
          version: '0.9.33'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tools: 'just bun'
          cache: 'false'

      - name: Build frontend assets
        run: vx just ci-assets-build

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-${{ github.event.inputs.crate }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-${{ github.event.inputs.crate }}-

      - name: Install cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,nextest

      - name: Run mutation testing
        run: |
          shard_arg=""
          if [ -n "${{ github.event.inputs.shard }}" ]; then
            shard_arg="--shard ${{ github.event.inputs.shard }}"
          fi
          feature_args=()
          if cargo metadata --no-deps --format-version 1 \
              | jq -e --arg c "${{ github.event.inputs.crate }}" \
                  '.packages[] | select(.name == $c) | .features | has("test-helpers")' >/dev/null; then
            feature_args=(--features "test-helpers")
          fi
          cargo mutants -p ${{ github.event.inputs.crate }} $shard_arg --no-shuffle --timeout 120 -- --config-file .config/nextest.toml "${feature_args[@]}"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-results-${{ github.event.inputs.crate }}
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore
