[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "auroraview"
version = "0.5.12" # x-release-please-version
description = "AuroraView: Rust-powered WebView for Python apps & DCC embedding"
authors = [
    {name = "Hal Long", email = "hal.long@outlook.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
keywords = ["webview", "dcc", "maya", "houdini", "blender", "rust", "pyo3"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typing_extensions>=4.0.0; python_version<'3.8'"
]

[project.optional-dependencies]
qt = [
    "qtpy>=2.0.0",
]
# DCC-MCP ecosystem integration (auroraview.dcc_mcp).
# Optional: AuroraView keeps its "no mandatory third-party dependency" guarantee.
dcc-mcp = [
    # Pinned to the range we actually test against; 0.x may break on minor.
    "dcc-mcp-core>=0.20.25,<0.21",
]

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.0.0",
    "pytest-xdist>=3.5; python_version>='3.8'",
    "pytest-randomly>=3.15; python_version>='3.8'",
    "pytest-rerunfailures>=14.0; python_version>='3.8'",
    # Structured JSON test reports for agent/CI consumption
    "pytest-json-report>=1.5; python_version>='3.8'",
    # GitHub Actions inline annotations for test failures
    "pytest-github-actions-annotate-failures>=0.2; python_version>='3.8'",
    "coverage[toml]>=7.0",
    "websockets>=10.0",
    "playwright>=1.40.0; python_version>='3.8'",
    "pytest-qt>=4.2.0",
]
playwright = [
    "playwright>=1.40.0; python_version>='3.8'",
]
dev = [
    { include-group = "test" },
    "ruff>=0.8.0",
    "mypy>=1.0",
    "pyright>=1.1",
    "maturin>=1.0",
]

[project.urls]
Homepage = "https://github.com/try-auroraview/auroraview"
Documentation = "https://github.com/try-auroraview/auroraview#readme"
Repository = "https://github.com/try-auroraview/auroraview"
Issues = "https://github.com/try-auroraview/auroraview/issues"

[project.scripts]
auroraview = "auroraview.__main__:main"

[tool.maturin]
python-source = "python"
module-name = "auroraview._core"
# Default builds stay non-abi3 so Python 3.7 source builds remain valid.
# CI passes abi3-py38 explicitly for Python 3.8+ release wheels.
# Note: runtime-desktop and runtime-dcc are optional features for advanced use cases
features = ["python-bindings", "pyo3/extension-module", "runtime-desktop", "runtime-dcc"]
bindings = "pyo3"

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py37"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402", "I001"]
"tests/test_nuke_ipc.py" = ["W293", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["auroraview"]

# MyPy configuration
[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_optional = true

# Pytest configuration
#
# This section is the single source of truth for pytest settings. Do NOT add a
# `pytest.ini` / `tox.ini` / `setup.cfg` anywhere under `tests/`: pytest picks
# its inifile by walking *up* from the CLI path arguments and stopping at the
# first directory that owns one, so a config file next to (or below) the test
# tree silently shadows this entire section -- including `addopts`.
[tool.pytest.ini_options]
minversion = "7.0"
# Coverage flags deliberately live OUT of `addopts`. They used to be here, but
# `addopts` applies to every invocation, and `[tool.coverage.report] fail_under`
# is 35: any single-file run (the DCC integration jobs, `pytest -k` subsets)
# reports well under 35% and would fail the job. Coverage is therefore passed
# explicitly by the jobs that actually consume `coverage.xml`.
# `-q` is also kept out: addopts are applied before CLI flags, so a `-q` here
# cancels the `-v` that every CI job passes and flattens the CI logs.
addopts = "-ra --strict-markers --timeout=60"
# `pythonpath` entries are resolved relative to `rootdir`. The removed
# `tests/pytest.ini` declared `pythonpath = .` while it was itself the rootdir,
# so it put `<repo>/tests` on `sys.path`; spell that out explicitly now that
# rootdir is the repo root.
pythonpath = ["tests"]
# Merged from the removed `tests/pytest.ini` (pytest-asyncio settings).
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# Default selection for a bare `pytest` at the repo root (the only invocation
# that reads `testpaths`; every CI/just/nox entry passes explicit paths).
# The two root-level dispatcher suites are listed explicitly: they are pure
# logic with no GUI dependency, and were silently drifting because no
# directory in this list covered them. The remaining root tests/ files need a
# display or a running app, so they stay outside the default run.
# `tests/python/integration` is deliberately kept out: it needs a built native
# core plus Qt, so a bare run there aborts on collection errors and hangs in
# `test_browser_integration.py` without a display. CI runs that directory
# explicitly, with the known-problematic e2e modules excluded.
testpaths = [
    "tests/python/unit",
    "tests/test_thread_dispatcher.py",
    "tests/test_thread_safety_diagnosis.py",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 60
timeout_method = "thread"
# Backstop for the `--strict-markers` flag in `addopts` above: turns
# `PytestUnknownMarkWarning` into an error, so an unregistered marker fails
# regardless of pytest version. This is the load-bearing line.
#
# Why a backstop is needed: `--strict-markers` reaches pytest via `addopts`,
# and whether `addopts` can set it depends on the pytest version. Verified on
# three versions with a deliberately undeclared marker:
#
#   pytest 8.4.2 / 9.1.1  `--strict-markers` in addopts -> collection error
#   pytest 9.0.2          `--strict-markers` in addopts -> warning only, exits 0
#
# so on 9.0.x the flag alone silently does nothing and this filter is what
# fails the run. CI currently resolves 8.4.2 (Python 3.9 job) and 9.1.1 (DCC
# jobs), but that is pip's choice, not ours -- do not rely on it.
#
# Do NOT "fix" this by setting `strict_markers = true`: despite pytest's own
# `_pytest/mark/structures.py` reading that key via `getini`, it is not a
# registered ini option on 8.4.2, which emits
# `PytestConfigWarning: Unknown config option: strict_markers` on every run.
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]
# Union of the markers previously declared in `pyproject.toml` and
# `tests/pytest.ini`, plus the ones that were only registered ad-hoc from
# `tests/conftest.py` or not registered at all. With `--strict-markers` an
# undeclared marker is a hard error, so every marker used anywhere in the
# suite has to be listed here.
markers = [
    "asyncio: Async tests",
    "blender: Tests that require Blender",
    "cdp: Tests using Chrome DevTools Protocol",
    "e2e: End-to-end tests",
    "edge_webdriver: Tests that use Edge WebDriver (Selenium)",
    "flaky: Flaky tests (auto-rerun up to 2 times)",
    "godot: Tests that require Godot",
    "headless: Headless tests (no display required)",
    "integration: Integration tests",
    "maya: Maya-specific tests",
    "openscad: Tests that require OpenSCAD",
    "playwright: Tests that use Playwright",
    "qt: Qt-specific tests",
    "qt_related: Tests related to Qt subsystems (requires qtpy installed, but not a live display/runtime)",
    "serial: Tests that must run serially",
    "slow: Slow running tests (deselect with '-m \"not slow\"')",
    "smoke: Small smoke tests",
    "ui: UI tests (requires display)",
    "unit: Unit tests",
    "webview2_cdp: Tests that connect to WebView2 via CDP (Windows only)",
    "xvfb: Tests that use Xvfb virtual display (Linux only)",
]

# Coverage configuration
[tool.coverage.run]
source = ["auroraview"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    # Omit environment-dependent GUI backends from coverage stats
    # Note: paths use module notation (forward slashes, no .py extension)
]

[tool.coverage.report]
# Note: Lower threshold due to GUI-dependent code that requires display environment
fail_under = 35
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
