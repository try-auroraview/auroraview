[tools]
just = "latest"
# exception: pinned to the .python-version (3.11) of this repo, not the 3.12
# baseline default. Bump both together when moving off 3.11.
#
# The patch is pinned exactly on purpose. A floating "3.11" makes `vx lock`
# track the newest python-build-standalone patch (3.11.16 from 20260924), which
# the vx install-side version index then cannot resolve -- `vx install python`
# fails with "No version found for python matching '3.11.16'" and takes the
# gallery / macOS arm64 CLI release jobs down. Bump the patch deliberately
# (lock + CI + local together); vx-lock-guard verifies the pinned version
# actually installs.
python = "3.11.15"
rust = "1.95.0"
uv = "latest"

# Windows-only toolchain pieces. Gated via the `os` field so that
# `vx sync` on Linux / macOS CI runners does not try to install
# MSVC build tools or rcedit (which have no non-Windows binaries).
# Both are artifact tools: their version ends up in the packaged exe, so they
# are pinned instead of floating on `latest`.
rcedit = { version = "2.0.0", os = ["windows"] }
# MSVC is host-provided (Visual Studio Build Tools): vx cannot install a
# numbered MSVC version, so it must be requested as "system".
msvc = { version = "system", os = ["windows"] }

# No [scripts] here on purpose: every entry was a verbatim `just xxx` mirror of
# a justfile recipe, so the two copies drifted silently whenever a recipe was
# renamed. Run `just <recipe>` instead.
#
# Non-mirror entries that were dropped with this table:
#   - `auroraview = "python -m auroraview.__main__"` -> new `auroraview` recipe.
#   - `doc = "cargo doc"` -> the `docs` recipe already runs
#     `cargo doc --no-deps --document-private-items --open`.
#   - `nox = "uvx nox"` -> the `nox` recipe already runs `vx uvx nox -s pytest`.
#   - `mcp-*` (12 entries) -> retired with the standalone Python
#     `auroraview-mcp` package; the justfile has had no `mcp-*` recipe since.
